function catHTML(c,index,total){
  const goals=c.goals.map(g=>goalHTML(c.id,g)).join("");
  // difficulty breakdown for this category
  const cnt={low:0,mid:0,high:0};
  c.goals.forEach(g=>{cnt[g.cal||"mid"]++});
  const tally=`
    <span class="tally"><i style="background:var(--cal-high)"></i>高 ${cnt.high}</span>
    <span class="tally"><i style="background:var(--cal-mid)"></i>中 ${cnt.mid}</span>
    <span class="tally"><i style="background:var(--cal-low)"></i>低 ${cnt.low}</span>`;
  // project-wide progress = average of goal progress
  const cprog=c.goals.length?Math.round(c.goals.reduce((s,g)=>s+goalProg(g),0)/c.goals.length):0;
  return `<div class="cat">
    <div class="cat-head">
      <div class="cat-order">
        <button class="ord ${index===0?'off':''}" onclick="moveCat('${c.id}',-1)" title="上へ">▲</button>
        <button class="ord ${index===total-1?'off':''}" onclick="moveCat('${c.id}',1)" title="下へ">▼</button>
      </div>
      <div class="chip"></div>
      <h3 contenteditable spellcheck="false" oninput="renameCat('${c.id}',this.textContent)">${esc(c.name)}</h3>
      <div class="cat-due-wrap">
        <span class="cat-due-label" onclick="openDuePicker(event,'cat','${c.id}')">${c.due?'⏱ '+c.due.slice(5).replace('-','/'):'締め切りを設定'}</span>
      </div>

      <div class="cat-prog"><div class="cp-bar"><i style="width:${cprog}%"></i></div><span class="cp-num">${cprog}%</span></div>
      <div class="cat-tally">${tally}</div>
      <span class="count">${c.goals.length} GOAL${c.goals.length!==1?'S':''}</span>
      <span class="add-goal-h" onclick="addGoal('${c.id}')">+ 目標</span>
      <span class="del" onclick="delCat('${c.id}')">DELETE</span>
    </div>
    <div class="cards" data-cat="${c.id}">
      ${goals}
      <div class="add-goal" onclick="addGoal('${c.id}')">+ NEW GOAL</div>
    </div>
  </div>`;
}
function goalProg(g){
  // if the goal has steps, progress = ratio of checked steps (auto). otherwise use manual value.
  if(g.checks && g.checks.length){
    const done=g.checks.filter(c=>c.on).length;
    return Math.round(done/g.checks.length*100);
  }
  return g.prog||0;
}
function goalHTML(cid,g){
  const cal=g.cal||"mid";
  const col=CAL_COLOR[cal]||CAL_COLOR.mid;
  const auto=!!(g.checks && g.checks.length);   // steps present -> auto mode
  const prog=goalProg(g);
  const r=25,circ=2*Math.PI*r,off=circ*(1-prog/100);
  const checks=g.checks.map((ch,i)=>`
    <div class="check ${ch.on?'on':''} ${ch.active?'active':''}">
      <div class="box" onclick="toggleCheck('${cid}','${g.id}',${i})"></div>
      <span class="t" contenteditable spellcheck="false" oninput="editCheck('${cid}','${g.id}',${i},this.textContent)">${esc(ch.t)}</span>
      <span class="play ${ch.active?'on':''}" title="着手中にする" onclick="toggleStepActive('${cid}','${g.id}',${i})">▸</span>
      <span class="star ${ch.today?'on':''}" title="今日やる" onclick="toggleToday('${cid}','${g.id}',${i})">${ch.today?'●':'○'}</span>
      <span class="x" onclick="delCheck('${cid}','${g.id}',${i})">✕</span>
    </div>`).join("");
  const calBtns=["low","mid","high"].map(k=>{
    const lab={low:"低",mid:"中",high:"高"}[k];
    return `<button class="cal-btn ${cal===k?'active':''}" data-cal="${k}" onclick="setGoalCal('${cid}','${g.id}','${k}')">${lab}</button>`;
  }).join("");
  // slider row: manual input when no steps, read-only auto bar when steps exist
  const sliderRow = auto
    ? `<div class="slider-row auto"><div class="auto-bar"><i style="width:${prog}%"></i></div></div>`
    : `<div class="slider-row">
         <input type="range" min="0" max="100" value="${prog}" oninput="setProg('${cid}','${g.id}',this.value,this)"></div>`;
  return `<div class="card glass ${prog>=100?'done':''}" style="--cat:${col[0]};--cat-glow:${col[1]}" draggable="true" data-cat="${cid}" data-goal="${g.id}">
    <div class="card-top">
      <div class="grip" title="ドラッグで並べ替え">⠿</div>
      <div class="ring">
        <svg width="60" height="60">
          <circle cx="30" cy="30" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="4" fill="none"/>
          <circle cx="30" cy="30" r="${r}" stroke="var(--cat,#e0913f)" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="${circ}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .4s"/>
        </svg>
        <div class="pct">${prog}%</div>
      </div>
      <div class="card-title">
        <div class="name" contenteditable spellcheck="false" oninput="renameGoal('${cid}','${g.id}',this.textContent)">${esc(g.name)}</div>
        <div class="goal-due-inline">
          ${g.due?`<span class="due-badge-inline" onclick="openDuePicker(event,'goal','${cid}','${g.id}')">⏱ ${g.due.slice(5).replace('-','/')}</span>`:`<span class="due-badge-inline muted" onclick="openDuePicker(event,'goal','${cid}','${g.id}')">締め切りを設定</span>`}
        </div>
        <div class="meta">${prog>=100?'■ COMPLETE':'▸ IN PROGRESS'}</div>

      </div>
    </div>
    <div class="cal-row">
      <span class="cal-lab">難易度</span>
      <div class="cal-toggle">${calBtns}</div>
    </div>
    ${sliderRow}
    <div class="checks">
      <div class="clab">今日の小さな一歩</div>
      ${checks}
    </div>
    <span class="add-check" onclick="addCheck('${cid}','${g.id}')">+ ステップを追加</span>
    <div class="card-foot"><span class="del-g" onclick="delGoal('${cid}','${g.id}')">REMOVE</span></div>
  </div>`;
}

// goal mutations
function findG(cid,gid){const c=data.cats.find(x=>x.id===cid);return[c,c.goals.find(x=>x.id===gid)]}
function setProg(cid,gid,v,el){const[,g]=findG(cid,gid);g.prog=+v;el.style.setProperty('--p',v+'%');
  const card=el.closest('.card');card.querySelector('.pct').textContent=v+'%';
  const r=25,circ=2*Math.PI*r;card.querySelector('.ring circle:last-child').style.strokeDashoffset=circ*(1-v/100);
  card.querySelector('.meta').textContent=v>=100?'■ COMPLETE':'▸ IN PROGRESS';card.classList.toggle('done',v>=100);
  renderMetrics();save()}
function renameGoal(cid,gid,t){const[,g]=findG(cid,gid);g.name=t;save()}
function setNote(cid,gid,t){const[,g]=findG(cid,gid);g.note=t;save()}
function addGoal(cid){data.cats.find(x=>x.id===cid).goals.push({id:uid(),name:"新しい目標",cal:"mid",prog:0,note:"",checks:[]});render()}
function delGoal(cid,gid){const c=data.cats.find(x=>x.id===cid);c.goals=c.goals.filter(x=>x.id!==gid);render()}
function toggleCheck(cid,gid,i){const[,g]=findG(cid,gid);const was=g.checks[i].on;g.checks[i].on=!was;if(!was){g.checks[i].active=false;bumpAchieve(g.checks[i].t);}else{unbumpAchieve(g.checks[i].t);}render()}
function editCheck(cid,gid,i,t){const[,g]=findG(cid,gid);g.checks[i].t=t;save()}
function addCheck(cid,gid){const[,g]=findG(cid,gid);g.checks.push({t:"新しいステップ",on:false});render()}
function delCheck(cid,gid,i){const[,g]=findG(cid,gid);g.checks.splice(i,1);render()}
function setGoalCal(cid,gid,k){const[,g]=findG(cid,gid);g.cal=k;render()}
function renameCat(cid,t){data.cats.find(x=>x.id===cid).name=t;save()}
function delCat(cid){if(confirm("このカテゴリと中の目標をすべて削除します。よろしいですか？")){data.cats=data.cats.filter(x=>x.id!==cid);render()}}
function moveCat(cid,dir){
  const i=data.cats.findIndex(x=>x.id===cid);
  const j=i+dir;
  if(i<0||j<0||j>=data.cats.length)return;
  [data.cats[i],data.cats[j]]=[data.cats[j],data.cats[i]];
  render();
}

function renderMetrics(){
  // プロジェクト数
  const projects=data.cats.length;
  // ステップ総数 / 達成済（今オンになっているステップ数）
  let stepTotal=0,stepDone=0;
  data.cats.forEach(c=>c.goals.forEach(g=>(g.checks||[]).forEach(ch=>{stepTotal++;if(ch.on)stepDone++;})));
  // 達成カウント（今日 / 今週）
  const ach=achieveStats();
  const streak=streakDays();
  const wbd=weekByDay();
  const wkMax=Math.max(1,...wbd);
  const todayDow=(new Date(routineDayKey()+"T00:00:00").getDay()+6)%7; // 月=0..日=6
  const DOW_MINI=["月","火","水","木","金","土","日"];
  // 今日メトリクス：ストリークがあればバッジを添える
  const streakBadge = streak>0
    ? `<div class="streak-badge" title="連続達成日数">🔥 ${streak}日連続</div>`
    : "";
  // 今週メトリクス：曜日別ミニバー
  const weekBars = `<div class="wk-bars">`+wbd.map((n,i)=>{
    const h=Math.round((n/wkMax)*100);
    const cls=(i===todayDow?'is-today':'')+(n>0?' has':'');
    const barH = n>0?Math.max(20,h):0;
    return `<div class="wk-bar ${cls}" title="${DOW_MINI[i]}: ${n}件"><div class="bar-track"><span style="height:${barH?barH+'%':'4px'}"></span></div><b>${DOW_MINI[i]}</b></div>`;
  }).join("")+`</div>`;
  // 今日メトリクス：今日やることの 完了数 / 総数（例 2/6）
  const tp=todayProgress();
  // 上段メトリクス（TODAY/THIS WEEK はクリックで完了内容パネル）
  const top=
    metricClickable("TODAY",tp.done,"/"+tp.total,"accent","showAchievePanel('today')",streakBadge)+
    metricClickable("THIS WEEK",ach.week,"","","showAchievePanel('week')",weekBars)+
    metric("STEPS",stepDone,"/"+stepTotal)+
    metric("PROJECTS",projects,"");
  // カウンター群
  const counters=data.routine.counters||[];
  let counterHTML="";
  const chips=counters.map(c=>`
    <div class="counter-chip">
      <div class="cc-name" contenteditable spellcheck="false" oninput="renameCounter('${c.id}',this.textContent)">${esc(c.name)}</div>
      <div class="cc-count">${c.count||0}<small>回</small></div>
      <div class="cc-ctrl">
        <button class="cc-btn" title="-1" onclick="bumpCounter('${c.id}',-1)">−</button>
        <button class="cc-btn" title="+1" onclick="bumpCounter('${c.id}',1)">＋</button>
        <span class="cc-del" title="削除" onclick="delCounter('${c.id}')">✕</span>
      </div>
    </div>`).join("");
  counterHTML=`
    <div class="counters-wrap">
      <div class="counters-grid">
        ${chips}
        <div class="counter-add" onclick="addCounter()">＋ 新しいカウンター</div>
      </div>
    </div>`;
  document.getElementById("metrics").innerHTML=top;
  // カウンターは metrics の直後の専用コンテナへ
  let cc=document.getElementById("countersBox");
  if(!cc){
    cc=document.createElement("div"); cc.id="countersBox";
    document.getElementById("metrics").insertAdjacentElement("afterend",cc);
  }
  cc.innerHTML=counterHTML;
}
function metric(lab,val,suf,cls=""){return `<div class="metric glass ${cls}"><div class="lab">${lab}</div><div class="val">${val}<small>${suf}</small></div></div>`}
function metricClickable(lab,val,suf,cls,onclick,extra=""){return `<div class="metric glass clickable ${cls}" onclick="${onclick}"><div class="lab">${lab}</div><div class="val">${val}<small>${suf}</small></div>${extra}<div class="metric-hint">タップで内訳 ›</div></div>`}

// ====== 達成内容パネル（今日 / 今週） ======
function showAchievePanel(scope){
  const names=achieveNames(scope);
  const title = scope==="today" ? "今日 完了したこと" : "今週 完了したこと";
  // 名前ごとに件数を集計
  const tally={};
  names.forEach(n=>{tally[n]=(tally[n]||0)+1;});
  const entries=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  let body;
  if(entries.length===0){
    body=`<div class="ap-empty">まだ記録がありません。タスクやステップを完了すると、ここに残ります。</div>`;
  }else{
    body=`<div class="ap-list">`+entries.map(([n,c])=>`
      <div class="ap-row"><span class="ap-name">${esc(n)}</span><span class="ap-count">${c>1?'×'+c:''}</span></div>`).join("")+`</div>`;
  }
  const note = scope==="week"
    ? `<div class="ap-note">※ 完了内容の記録は直近1週間ぶんを保持しています。</div>` : "";
  let bg=document.getElementById("achievePanel");
  if(!bg){
    bg=document.createElement("div"); bg.id="achievePanel"; bg.className="modal-bg";
    bg.addEventListener("click",e=>{if(e.target.id==="achievePanel")bg.classList.remove("show");});

    <h4>${title} · 計 ${names.length} 件</h4>

    <div class="row" style="margin-top:18px"><button class="btn" onclick="document.getElementById('achievePanel').classList.remove('show')">閉じる</button></div>
  </div>`;
  bg.classList.add("show");
}

// ====== DRAG & DROP (reorder within a category) ======
let dragEl=null;
function attachDrag(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragEl=card;card.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.card.over').forEach(c=>c.classList.remove('over'));commitOrder()});
    card.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragEl||dragEl===card)return;
      if(dragEl.dataset.cat!==card.dataset.cat)return; // same category only
      const box=card.getBoundingClientRect();
      const after=(e.clientY-box.top)/box.height>0.5;
      card.classList.add('over');
      const parent=card.parentNode;
      if(after)parent.insertBefore(dragEl,card.nextSibling);
      else parent.insertBefore(dragEl,card);
    });
    card.addEventListener('dragleave',()=>card.classList.remove('over'));
  });
}
function commitOrder(){
  document.querySelectorAll('.cards').forEach(box=>{
    const cid=box.dataset.cat;const c=data.cats.find(x=>x.id===cid);if(!c)return;
    const order=[...box.querySelectorAll('.card')].map(el=>el.dataset.goal);
    c.goals.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  });
  save();
}

function setCatDue(cid,val){const c=data.cats.find(x=>x.id===cid);if(c){c.due=val;save();renderBoard();}}

let _duePicker={kind:null,cid:null,gid:null,cursor:null};
function getDueValue(){
  if(_duePicker.kind==="goal"){const[,g]=findG(_duePicker.cid,_duePicker.gid);return g?g.due:"";}
  if(_duePicker.kind==="cat"){const c=data.cats.find(x=>x.id===_duePicker.cid);return c?c.due:"";}
  return "";
}
function applyDueValue(val){
  if(_duePicker.kind==="goal")setGoalDue(_duePicker.cid,_duePicker.gid,val);
  else if(_duePicker.kind==="cat")setCatDue(_duePicker.cid,val);
}
function openDuePicker(ev,kind,cid,gid){
  ev.stopPropagation();
  _duePicker.kind=kind; _duePicker.cid=cid; _duePicker.gid=gid||null;
  const cur=getDueValue();
  _duePicker.cursor = cur ? new Date(cur+"T00:00:00") : new Date();
  _duePicker.cursor.setDate(1);
  renderDuePicker(ev.currentTarget);
}
function duePickerShift(n){
  _duePicker.cursor.setMonth(_duePicker.cursor.getMonth()+n);
  renderDuePicker(null);
}
function selectDueDate(key){ applyDueValue(key); closeDuePicker(); }
function clearDue(){ applyDueValue(""); closeDuePicker(); }
function closeDuePicker(){ const p=document.getElementById("duePicker"); if(p)p.remove(); }
function renderDuePicker(anchorEl){
  let p=document.getElementById("duePicker");
  if(!p){
    p=document.createElement("div"); p.id="duePicker"; p.className="due-picker glass";
    document.body.appendChild(p);
    // 外側クリックで閉じる
    setTimeout(()=>{document.addEventListener("click",_duePickerOutside);},0);
  }
  const cur=getDueValue();
  const y=_duePicker.cursor.getFullYear(), m=_duePicker.cursor.getMonth();
  const first=new Date(y,m,1), startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayKey=dateKey(new Date());
  const DOWmini=["日","月","火","水","木","金","土"];
  let dows=DOWmini.map((d,i)=>`<div class="dp-dow ${i===0?'sun':''}${i===6?'sat':''}">${d}</div>`).join("");
  let cells="";
  for(let i=0;i<startDow;i++)cells+=`<div class="dp-cell blank"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const key=dateKey(new Date(y,m,day));
    const isToday=key===todayKey, isSel=key===cur;
    cells+=`<div class="dp-cell ${isToday?'dp-today':''} ${isSel?'sel':''}" onclick="selectDueDate('${key}')">${day}</div>`;
  }
  p.innerHTML=`
    <div class="dp-head">
      <button class="dp-nav" onclick="duePickerShift(-1)">‹</button>
      <div class="dp-month">${y}年 ${m+1}月</div>
      <button class="dp-nav" onclick="duePickerShift(1)">›</button>
    </div>
    <div class="dp-dow-row">${dows}</div>
    <div class="dp-grid">${cells}</div>
    <div class="dp-foot">
      <button class="dp-clear" onclick="clearDue()">クリア</button>
      <button class="dp-close" onclick="closeDuePicker()">閉じる</button>
    </div>`;
  // 位置決め：アンカー近くに、画面外へ出ないよう調整
  if(anchorEl){
    const r=anchorEl.getBoundingClientRect();
    const pw=288, ph=360;
    let left=r.left+window.scrollX;
    let top=r.bottom+window.scrollY+8;
    if(left+pw>window.scrollX+document.documentElement.clientWidth-12)
      left=window.scrollX+document.documentElement.clientWidth-pw-12;
    if(left<window.scrollX+12)left=window.scrollX+12;
    // 下に入らなければ上に出す
    if(r.bottom+ph>document.documentElement.clientHeight && r.top-ph>0)
      top=r.top+window.scrollY-ph-8;
    p.style.left=left+"px"; p.style.top=top+"px";
  }
}
function _duePickerOutside(e){
  const p=document.getElementById("duePicker");
  if(p && !p.contains(e.target)){ p.remove(); document.removeEventListener("click",_duePickerOutside); }
}

// does a (possibly repeating) event occur on the given date key?
function occursOn(e,key){
  const target=new Date(key+"T00:00:00");
  const start=new Date(e.date+"T00:00:00");
  if(target<start)return false;
  if(e.repeatEnd){const end=new Date(e.repeatEnd+"T00:00:00");if(target>end)return false;}
  const rep=e.repeat||"none";
  if(rep==="none")return e.date===key;
  if(rep==="daily")return true;
  const dayMs=86400000;
  const diffDays=Math.round((target-start)/dayMs);
  if(rep==="weekly")return target.getDay()===start.getDay();
  if(rep==="biweekly")return target.getDay()===start.getDay() && (Math.floor(diffDays/7)%2===0);
  if(rep==="monthly")return target.getDate()===start.getDate();
  return false;
}
function eventsOn(key){
  return data.events.filter(e=>occursOn(e,key))
    .sort((a,b)=>{
      // events first (by time), memos after
      const am=a.kind==="memo"?1:0, bm=b.kind==="memo"?1:0;
      if(am!==bm)return am-bm;
      return (a.time||"99:99").localeCompare(b.time||"99:99");
    });
}

function renderCalendar(){
  const el=document.getElementById("calendar"); if(!el)return;
  const y=calCursor.getFullYear(), m=calCursor.getMonth();
  document.getElementById("calMonth").textContent=`${y}年 ${m+1}月`;
  const first=new Date(y,m,1), startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayKey=dateKey(new Date());

  let dows="";
  DOW_EN.forEach((d,i)=>{dows+=`<div class="cal-dow ${i===0?'sun':''}${i===6?'sat':''}">${d}</div>`});
  let cells="";
  for(let i=0;i<startDow;i++)cells+=`<div class="cal-cell blank"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const d=new Date(y,m,day), key=dateKey(d);
    const all=eventsOn(key);
    const events=all.filter(e=>e.kind!=="memo");
    const memos=all.filter(e=>e.kind==="memo");
    const isToday=key===todayKey;
    const isPast=key<todayKey;
    const hol=holidayName(key);
    // events: show title (as before)
    let evHTML=events.map(e=>{
      const rep=(e.repeat&&e.repeat!=="none")?'<span class="rep">↻</span>':"";
      return `<div class="cal-ev" onclick="event.stopPropagation();openDay('${key}')">${e.time?`<span class="t">${e.time}</span>`:""}${rep}${esc(e.title)}</div>`;
    }).join("");
    // memos: marks only, no text (private). click to open detail.
    const memoMarks=memos.map(e=>
      `<span class="memo-dot" title="記録（クリックで表示）" onclick="event.stopPropagation();openDay('${key}')">◍</span>`
    ).join("");
    const dateRow=`<div class="cal-date-row"><span class="cal-date">${day}</span>${memoMarks?`<span class="memo-marks">${memoMarks}</span>`:""}</div>`;
    const holHTML=hol?`<span class="cal-hol" title="${esc(hol)}">${esc(hol)}</span>`:"";
    cells+=`<div class="cal-cell ${isToday?'today':''} ${isPast?'past':''} ${hol?'holiday':''}" onclick="openDay('${key}')">
      ${dateRow}${evHTML}${holHTML}</div>`;
  }
  // pad the last row so every row has 7 cells (keeps column widths stable)
  const totalCells=startDow+daysInMonth;
  const trailing=(7-(totalCells%7))%7;
  for(let i=0;i<trailing;i++)cells+=`<div class="cal-cell blank"></div>`;
  el.innerHTML=`<div class="cal-dow-row">${dows}</div><div class="cal-grid">${cells}</div>`;
}

  }else{

      const when=isMemo?"記録":(e.time||"終日");
      const rep=(e.repeat&&e.repeat!=="none")?`<span class="dm-tag">↻ 繰り返し</span>`:"";

    }).join("");
  }
  document.getElementById("dayAddBtn").onclick=()=>{ closeDay(); openEvent(null,key); };
  modal.classList.add("show");
}

// ======================================================================
function renderUpcoming(){
  const el=document.getElementById("upcoming"); if(!el)return;
  const now=new Date(); const todayKey=dateKey(now);
  // expand the next 60 days, collect event-kind occurrences (memos excluded)
  const occ=[];
  for(let i=0;i<60 && occ.length<12;i++){
    const d=new Date(); d.setDate(d.getDate()+i); const key=dateKey(d);
    data.events.forEach(e=>{
      if((e.kind||"event")==="event" && occursOn(e,key)){
        occ.push({e,key,d:new Date(key+"T00:00:00")});
      }
    });
  }
  occ.sort((a,b)=>(a.key+(a.e.time||"00:00")).localeCompare(b.key+(b.e.time||"00:00")));
  const up=occ.slice(0,5);
  let body;
  if(up.length===0){
    body=`<div class="up-empty">予定はまだありません。Calendar タブから追加できます。</div>`;
  }else{
    body=`<div class="up-list">`+up.map(o=>{
      const d=o.d, e=o.e;
      const md=`${d.getMonth()+1}/${d.getDate()}`;
      const wd=DOW[d.getDay()];
      const diff=Math.round((d - new Date(todayKey+"T00:00:00"))/86400000);
      const rel=diff===0?"今日":diff===1?"明日":`${diff}日後`;
      const rep=(e.repeat&&e.repeat!=="none")?' ↻':'';
      return `<div class="up-item" onclick="setView('calendar');openEvent('${e.id}')">
        <div class="up-when">${md}(${wd}) ${e.time||""}<span class="rel">${rel}${rep}</span></div>
        <div class="up-title">${esc(e.title)}</div>
      </div>`;
    }).join("")+`</div>`;
  }
  el.innerHTML=`<div class="up-label"><span class="up-big">UPCOMING</span></div>${body}`;
}

function openEvent(id=null, presetDate=null){
  editingEventId=id;
  const modal=document.getElementById("eventModal");
  const title=document.getElementById("eventModalTitle");
  const repeatSel=document.getElementById("evRepeat");
  const repeatEnd=document.getElementById("evRepeatEnd");
  if(id){
    const e=data.events.find(x=>x.id===id);
    if(!e)return;
    setEvType(e.kind||"event");
    title.textContent = (e.kind==="memo")?"EDIT · 記録を編集":"EDIT · 予定を編集";
    document.getElementById("evDate").value=e.date;
    document.getElementById("evTime").value=e.time||"";
    document.getElementById("evTitle").value=e.title;
    document.getElementById("evMemo").value=e.memo||"";
    repeatSel.value=e.repeat||"none";
    repeatEnd.value=e.repeatEnd||"";
    document.getElementById("evInToday").checked = (e.inToday!==false);
  }else{
    setEvType("event");
    title.textContent="NEW · 追加";
    document.getElementById("evDate").value=presetDate||dateKey(new Date());
    document.getElementById("evTime").value="";
    document.getElementById("evTitle").value="";
    document.getElementById("evMemo").value="";
    repeatSel.value="none";
    repeatEnd.value="";
    document.getElementById("evInToday").checked = true;
  }
  document.getElementById("repeatEndWrap").style.display = repeatSel.value==="none"?"none":"";
  repeatSel.onchange=()=>{document.getElementById("repeatEndWrap").style.display=repeatSel.value==="none"?"none":"";};
  // dynamic action row (delete + ics) — rebuild each open
  let actions=modal.querySelector(".ev-actions");
  if(actions)actions.remove();
  if(id){
    const e=data.events.find(x=>x.id===id);
    const row=document.createElement("div");
    row.className="ev-actions";
    const icsBtn=(e.kind!=="memo")?`<button class="btn" onclick="downloadICS('${id}')">📅 カレンダーに追加(.ics)</button>`:"<span></span>";
    row.innerHTML=`<button class="ev-del" onclick="deleteEvent()">削除</button>${icsBtn}`;
    modal.querySelector(".modal").appendChild(row);
  }
  modal.classList.add("show");
  modal.querySelector(".modal").scrollTop = 0;   // always start at the top of the form
  // Auto-focus the title only when the date is already decided (editing, or adding from a day cell).
  // For a calendar-wide new add (no id, no preset date), DON'T focus — let the user start from the
  // date selection at normal size instead of jumping/zooming into the title field.
  if(id || presetDate){
    document.getElementById("evTitle").focus();
  }
}
function closeEvent(){document.getElementById("eventModal").classList.remove("show")}
function saveEvent(){
  const date=document.getElementById("evDate").value;
  const time=document.getElementById("evTime").value;
  const title=document.getElementById("evTitle").value.trim();
  const memo=document.getElementById("evMemo").value.trim();
  const repeat=document.getElementById("evRepeat").value;
  const repeatEnd=document.getElementById("evRepeatEnd").value;
  const inToday=document.getElementById("evInToday").checked;
  if(!date||!title){alert("日付と見出しは必須です。");return;}
  const isMemo=evType==="memo";
  const rec={
    date, title, memo, kind:evType,
    time: isMemo?"":time,
    repeat: isMemo?"none":repeat,
    repeatEnd: (isMemo||repeat==="none")?"":repeatEnd,
    inToday: isMemo?false:inToday
  };
  if(editingEventId){
    Object.assign(data.events.find(x=>x.id===editingEventId),rec);
  }else{
    data.events.push({id:uid(),...rec});
  }
  closeEvent();render();
}
function deleteEvent(){
  if(!editingEventId)return;
  if(!confirm("これを削除しますか？"))return;
  data.events=data.events.filter(x=>x.id!==editingEventId);
  closeEvent();render();
}

function pad(n){return String(n).padStart(2,"0")}
function downloadICS(id){
  const e=data.events.find(x=>x.id===id); if(!e)return;
  // build start/end. If time given -> 1h block; else all-day.
  let dtStart,dtEnd,allDay=false;
  const [Y,M,D]=e.date.split("-").map(Number);
  if(e.time){
    const [h,mi]=e.time.split(":").map(Number);
    const s=new Date(Y,M-1,D,h,mi), en=new Date(s.getTime()+60*60*1000);
    const f=dt=>`${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
    dtStart=`DTSTART:${f(s)}`; dtEnd=`DTEND:${f(en)}`;
  }else{
    allDay=true;
    const en=new Date(Y,M-1,D+1);
    dtStart=`DTSTART;VALUE=DATE:${Y}${pad(M)}${pad(D)}`;
    dtEnd=`DTEND;VALUE=DATE:${en.getFullYear()}${pad(en.getMonth()+1)}${pad(en.getDate())}`;
  }
  const stamp=new Date();
  const dtstamp=`${stamp.getUTCFullYear()}${pad(stamp.getUTCMonth()+1)}${pad(stamp.getUTCDate())}T${pad(stamp.getUTCHours())}${pad(stamp.getUTCMinutes())}${pad(stamp.getUTCSeconds())}Z`;
  const esc2=s=>String(s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  // repeat -> RRULE
  let rrule="";
  const WD=["SU","MO","TU","WE","TH","FR","SA"];
  const sd=new Date(e.date+"T00:00:00");
  const until=e.repeatEnd?`;UNTIL=${e.repeatEnd.replace(/-/g,"")}T235900Z`:"";
  if(e.repeat==="daily")rrule=`RRULE:FREQ=DAILY${until}`;
  else if(e.repeat==="weekly")rrule=`RRULE:FREQ=WEEKLY;BYDAY=${WD[sd.getDay()]}${until}`;
  else if(e.repeat==="biweekly")rrule=`RRULE:FREQ=WEEKLY;INTERVAL=2;BYDAY=${WD[sd.getDay()]}${until}`;
  else if(e.repeat==="monthly")rrule=`RRULE:FREQ=MONTHLY;BYMONTHDAY=${sd.getDate()}${until}`;
  const ics=[
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Progress Deck//JP","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",`UID:${e.id}@progress-deck`,`DTSTAMP:${dtstamp}`,
    dtStart,dtEnd,rrule,`SUMMARY:${esc2(e.title)}`,
    e.memo?`DESCRIPTION:${esc2(e.memo)}`:"",
    "BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY",`DESCRIPTION:${esc2(e.title)}`,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].filter(Boolean).join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(e.title.replace(/[^\w\u3040-\u30ff\u4e00-\u9faf]/g,"_")||"event")+".ics";
  a.click();
}

// ======================================================================
// ====== 通知 / リマインド（アプリを開いている間に予定30分前に通知） ======
// ======================================================================
function refreshNotifyBtn(){
  const btn=document.getElementById("notifyBtn"); if(!btn)return;
  if(!("Notification" in window)){ btn.style.display="none"; return; }
  if(Notification.permission==="granted"){ btn.textContent="🔔 通知ON"; btn.disabled=true; btn.style.opacity=".6"; }
  else if(Notification.permission==="denied"){ btn.textContent="🔕 通知ブロック中"; btn.disabled=true; btn.style.opacity=".6"; }
  else { btn.textContent="🔔 通知を有効化"; btn.disabled=false; btn.style.opacity="1"; }
}
function enableNotifications(){
  if(!("Notification" in window)){ alert("このブラウザは通知に対応していません。"); return; }
  Notification.requestPermission().then(p=>{
    refreshNotifyBtn();
    if(p==="granted"){
      try{ new Notification("Progress Deck", {body:"通知を有効にしました。予定の30分前にお知らせします。"}); }catch(e){}
    }
  });
}
// 既に通知した予定×時刻の記録（重複通知を防ぐ。当日内のメモリのみ）
const _notified=new Set();
function checkReminders(){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  if(typeof data==="undefined" || !data || !data.events) return;
  const now=new Date();
  const todayK=dateKey(now);
  data.events.forEach(e=>{
    if((e.kind||"event")!=="event") return;
    if(!e.time) return;                       // 終日予定は対象外
    if(!occursOn(e,todayK)) return;
    const [h,mi]=e.time.split(":").map(Number);
    const evTime=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,mi);
    const lead=new Date(evTime.getTime()-30*60*1000);   // 30分前
    // リード時刻を過ぎていて、まだ予定時刻前で、未通知なら鳴らす
    const key=todayK+"|"+e.id+"|"+e.time;
    if(now>=lead && now<evTime && !_notified.has(key)){
      _notified.add(key);
      try{
        new Notification("まもなく予定", {body:`${e.time}　${e.title}`, tag:key});
      }catch(err){}
    }
  });
}
setInterval(checkReminders, 60*1000);   // 1分ごとにチェック
refreshNotifyBtn();

// close modals on backdrop click
document.getElementById("eventModal").addEventListener("click",e=>{if(e.target.id==="eventModal")closeEvent()});
document.getElementById("dayModal").addEventListener("click",e=>{if(e.target.id==="dayModal")closeDay()});
document.getElementById("monthModal").addEventListener("click",e=>{if(e.target.id==="monthModal")closeMonthPick()});

// Firebaseのロードが間に合わなかった場合のフォールバック（タイムアウト3秒）
setTimeout(()=>{
  if(!window._firebaseReady){
    data=defaultData();
    rolloverIfNeeded();
    render();
  }
}, 3000);
</script>

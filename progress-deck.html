<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>PROGRESS · DECK</title>
<!-- ホーム画面アイコン（iPhone / Android） -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png">
<link rel="icon" type="image/png" href="apple-touch-icon-512.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<script>
  // インライン Web App Manifest（単一HTMLのままインストール可能にする）
  (function(){
    const manifest={
      name:"Progress Deck", short_name:"Progress",
      start_url:".", display:"standalone",
      background_color:"#070707", theme_color:"#070707",
      icons:[
        {src:"apple-touch-icon-512.png", sizes:"512x512", type:"image/png"},
        {src:"apple-touch-icon.png", sizes:"180x180", type:"image/png"}
      ]
    };
    try{
      const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
      const link=document.createElement("link");
      link.rel="manifest"; link.href=URL.createObjectURL(blob);
      document.head.appendChild(link);
    }catch(e){}
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.min.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD9h01ojm1udmPDa1P-5UzSfcs0_Q6cbg0",
    authDomain: "progress-deck.firebaseapp.com",
    databaseURL: "https://progress-deck-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "progress-deck",
    storageBucket: "progress-deck.firebasestorage.app",
    messagingSenderId: "22418933605",
    appId: "1:22418933605:web:c1d4985c452572685e438c"
  };
  firebase.initializeApp(firebaseConfig);
  const _fbDb = firebase.database();
  const _fbRef = _fbDb.ref('progressDeck');
  window._fbRef = _fbRef;
  const _fbAuth = firebase.auth();

  window.firebaseSave = function(data) {
    _fbRef.set(data).then(() => {
      const el = document.getElementById("lastsave");
      if(el) el.textContent = "SAVED · " + new Date().toLocaleTimeString("ja-JP");
    }).catch(e => console.error("Firebase save error:", e));
  };

  // 実際にデータを読み込む処理（ログイン成功後にだけ呼ぶ）
  function _loadFromFirebase() {
    _fbRef.once('value', (snapshot) => {
      window._fbReady = true;
      const val = snapshot.val();
      if(val && val.cats && val.routine) {
        window._firebaseData = val;
      } else {
        const local = localStorage.getItem("progressDeck.v2");
        if(local) {
          try {
            const parsed = JSON.parse(local);
            if(parsed && parsed.cats && parsed.routine) {
              window._firebaseData = parsed;
              window.firebaseSave(parsed);
            }
          } catch(e) {}
        }
        if(!window._firebaseData) window._firebaseData = null;
      }
      if(window._onFirebaseReady) window._onFirebaseReady(window._firebaseData);
    }, (err) => {
      // 読み込みが拒否された（ルールで弾かれた等）場合
      console.error("Firebase read error:", err);
      window._fbAuthError = "DBアクセスが拒否されました（ルール設定を確認してください）";
    });
  }

  window._fbReady = false;
  // まず匿名ログイン。成功したらデータ読み込みへ。
  _fbAuth.signInAnonymously().catch((e) => {
    console.error("匿名ログイン失敗:", e);
    window._fbAuthError = "匿名ログインに失敗しました（Authentication設定を確認）";
  });
  _fbAuth.onAuthStateChanged((user) => {
    if(user){
      _loadFromFirebase(); // ログインできたのでデータ読み込み
    }
  });
</script>
<style>
  :root{
    /* ---- spectrum (poster): dusty orange → red → green → blue, all desaturated & dark ---- */
    --spec-orange:#d9763c;
    --spec-amber:#e0913f;
    --spec-red:#b8443e;
    --spec-green:#3f7a5f;
    --spec-teal:#2f6f72;
    --spec-blue:#2e5a8f;
    --spec-indigo:#2a3d6b;

    /* ink — never pure white. paper-grey hierarchy */
    --ink:#f0ece3;
    --ink-2:#bdb8ae;
    --ink-3:#8f8a80;
    --ink-4:#6b665d;

    /* surfaces — near-black, barely-there */
    --bg:#070707;
    --panel:rgba(255,255,255,.022);
    --panel-2:rgba(255,255,255,.04);
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.12);

    /* difficulty accents — muted, not candy */
    --cal-low:#5f8f6b;
    --cal-mid:#c79a52;
    --cal-high:#bf5b54;

    --r:18px;
    --ease:cubic-bezier(.22,.7,.24,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Outfit","Noto Sans JP",system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    padding:46px 40px 120px;
    overflow-x:hidden;
    position:relative;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.01em;
  }

  /* ============ THE BACKGROUND — light bleeding from one corner, spectrum smear ============ */
  .space{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg);}
  /* the bright source + the spectrum it casts, anchored top-left like the poster */
  .space::before{
    content:"";position:absolute;inset:-15%;
    background:
      radial-gradient(26% 24% at 20% 16%, rgba(244,214,150,.85), rgba(224,145,63,.42) 30%, rgba(184,68,62,.24) 52%, transparent 70%),
      radial-gradient(46% 40% at 30% 26%, rgba(217,118,60,.3), transparent 64%),
      radial-gradient(60% 54% at 56% 52%, rgba(63,122,95,.31), transparent 66%),
      radial-gradient(72% 66% at 74% 70%, rgba(46,90,143,.3), transparent 70%),
      radial-gradient(58% 56% at 88% 86%, rgba(42,61,107,.26), transparent 66%);
    filter:blur(10px) saturate(105%);
  }
  /* deep vignette so edges fall to black + keep the top-left text band readable */
  .space::after{content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 24%),
      radial-gradient(140% 130% at 28% 22%, transparent 30%, rgba(0,0,0,.62) 76%, rgba(0,0,0,.9) 100%);}

  /* faint engineering grid, like the poster's blueprint lines */
  .grid-lines{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(120% 100% at 30% 26%, #000 30%, transparent 80%);}

  .stars{position:absolute;inset:0;opacity:.7;
    background-image:
      radial-gradient(1px 1px at 18% 32%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 72% 18%, rgba(255,240,220,.6), transparent),
      radial-gradient(1px 1px at 44% 72%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 88% 58%, rgba(220,235,255,.55), transparent),
      radial-gradient(1px 1px at 58% 88%, rgba(255,255,255,.45), transparent),
      radial-gradient(1px 1px at 9% 80%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 93% 38%, rgba(255,255,255,.4), transparent);
    background-repeat:no-repeat;}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.04;mix-blend-mode:overlay;
    background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}

  .wrap{max-width:1240px;margin:0 auto;position:relative;z-index:2}

  /* ============ glass — barely there, no candy glow ============ */
  .glass{position:relative;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);
    backdrop-filter:blur(20px) saturate(115%);-webkit-backdrop-filter:blur(20px) saturate(115%);}
  .glass > *{position:relative;z-index:1}

  /* ============ header ============ */
  header.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:30px}
  .brand .kicker{font-size:10px;letter-spacing:.55em;text-transform:uppercase;color:var(--ink-2);font-weight:400;display:flex;align-items:center;gap:11px}
  .brand h1{font-weight:200;font-size:clamp(24px,3vw,36px);letter-spacing:.16em;line-height:1.05;margin-top:14px;text-transform:uppercase;color:var(--ink)}
  .brand .tag{font-size:13px;color:var(--ink-2);letter-spacing:.06em;margin-top:12px;font-weight:300}
  .ping{width:6px;height:6px;border-radius:50%;background:var(--spec-amber);box-shadow:0 0 12px 2px rgba(224,145,63,.6)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .clock{text-align:right;font-family:"Roboto Mono",monospace;font-size:12px;color:var(--ink-3);letter-spacing:.14em;line-height:2.1;font-weight:300}
  .clock b{color:var(--ink-2);font-weight:400}
  .clock-row{display:flex;align-items:center;gap:12px}
  .sync-btn{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);border-radius:50%;
    width:34px;height:34px;flex:0 0 auto;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;transition:.18s var(--ease);-webkit-tap-highlight-color:transparent}
  .sync-btn:hover{border-color:var(--spec-amber);color:var(--ink)}
  .sync-btn.spin{animation:syncspin .7s linear infinite;border-color:var(--spec-amber);color:var(--spec-amber)}
  @keyframes syncspin{to{transform:rotate(360deg)}}

  /* ============ metrics ============ */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:14px;margin-bottom:14px}
  .metric{padding:18px 18px 16px;position:relative;overflow:hidden}
  .metric .lab{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
  .metric .val{font-size:36px;font-weight:100;margin-top:11px;letter-spacing:.01em;line-height:1;color:var(--ink)}
  .metric .val small{font-size:13px;color:var(--ink-3);font-weight:300;letter-spacing:.02em}
  .metric.accent .val{background:linear-gradient(96deg,var(--spec-amber),var(--spec-red));-webkit-background-clip:text;background-clip:text;color:transparent}
  .metric .spark{display:none}

  .echo{padding:20px 26px;margin-bottom:44px;display:flex;gap:16px;align-items:center;font-size:14px;font-weight:300;letter-spacing:.04em;color:var(--ink-2);
    border:1px solid var(--line);border-radius:var(--r);background:var(--panel);backdrop-filter:blur(14px)}
  .echo .orb{width:7px;height:7px;border-radius:50%;flex:0 0 auto;align-self:center;
    background:var(--spec-amber);box-shadow:0 0 14px 3px rgba(224,145,63,.5)}

  /* ============ section title ============ */
  .sec-title{font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin:8px 2px 22px;display:flex;align-items:center;gap:16px}
  .sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}

  /* ============ buttons ============ */
  .btn{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);border-radius:10px;
    padding:10px 17px;font-size:11.5px;font-family:inherit;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;transition:.22s var(--ease);display:inline-flex;align-items:center;gap:8px;font-weight:400}
  .btn:hover{border-color:var(--ink-2);color:var(--ink);background:rgba(255,255,255,.03)}
  .btn.solid{background:linear-gradient(96deg,var(--spec-amber),var(--spec-red));color:#1a0d06;border:none;font-weight:500}
  .btn.solid:hover{filter:brightness(1.08)}
  .controls{display:flex;gap:11px;flex-wrap:wrap}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px;flex-wrap:wrap}

  /* ============ ROUTINE PANEL ============ */
  .routine{padding:36px;margin-bottom:56px;position:relative;overflow:hidden}
  .routine .halo{display:none}
  .routine-head{display:flex;align-items:center;gap:32px;flex-wrap:wrap;margin-bottom:34px}
  .routine-head .title{flex:1;min-width:200px}
  .routine-head .title .k{font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
  .routine-head .title h2{font-size:25px;font-weight:200;margin-top:10px;letter-spacing:.05em}
  .routine-head .title .sub{font-size:12px;color:var(--ink-3);margin-top:10px;letter-spacing:.06em;font-family:"Roboto Mono",monospace;font-weight:300}

  .ring-big{position:relative;width:130px;height:130px;flex:0 0 auto}
  .ring-big svg{transform:rotate(-90deg)}
  .ring-big .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-big .center .num{font-size:34px;font-weight:100;color:var(--ink)}
  .ring-big .center .cap{font-size:9.5px;letter-spacing:.34em;color:var(--ink-3);text-transform:uppercase;margin-top:5px}

  .perfect{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
  .stat{text-align:center;padding:18px 22px;border:1px solid var(--line);border-radius:14px;background:var(--panel);min-width:104px}
  .stat .n{font-size:30px;font-weight:100;color:var(--ink)}
  .stat .l{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);margin-top:7px;line-height:1.7}

  .rt-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px;margin-bottom:24px}
  .rt-check{display:flex;align-items:center;gap:13px;padding:15px 17px;border:1px solid var(--line);border-radius:13px;background:var(--panel);transition:.2s var(--ease)}
  .rt-check.on{background:rgba(224,145,63,.07);border-color:rgba(224,145,63,.28)}
  .rt-check .box{width:19px;height:19px;border-radius:6px;border:1.4px solid var(--line-2);flex:0 0 auto;cursor:pointer;position:relative;transition:.18s}
  .rt-check .box:hover{border-color:var(--spec-amber)}
  .rt-check.on .box{background:linear-gradient(135deg,var(--spec-amber),var(--spec-red));border-color:transparent}
  .rt-check.on .box::after{content:"";position:absolute;left:6px;top:2px;width:4px;height:10px;border:solid #150a04;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .rt-check .t{flex:1;font-size:13.5px;outline:none;font-weight:300;letter-spacing:.02em}
  .rt-check .t:focus{color:var(--ink)}
  .rt-check.on .t{color:var(--ink-2)}
  .rt-check .rate{font-size:10.5px;color:var(--ink-4);letter-spacing:.08em;font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
  .rt-check .x{opacity:0;cursor:pointer;color:var(--ink-4);font-size:12px;transition:.18s}
  .rt-check:hover .x{opacity:1}
  .rt-check .x:hover{color:var(--cal-high)}
  .add-rt{font-size:11px;color:var(--ink-3);cursor:pointer;letter-spacing:.16em;text-transform:uppercase;display:inline-block;margin-bottom:30px;transition:.2s}
  .add-rt:hover{color:var(--spec-amber)}

  .rt-note{margin-bottom:30px}
  .rt-note .lab{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-bottom:12px;display:flex;align-items:center;gap:9px}
  textarea.note{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    padding:15px 16px;font-size:13.5px;line-height:1.75;font-family:inherit;font-weight:300;resize:vertical;min-height:62px;letter-spacing:.02em}
  textarea.note:focus{outline:none;border-color:var(--line-2)}
  textarea.note::placeholder{color:var(--ink-4)}

  /* ============ analytics ============ */
  .analytics .lab{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-bottom:15px}
  .heat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
  .day{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);position:relative;cursor:default;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-4);font-family:"Roboto Mono",monospace}
  .day[data-lvl="full"]{background:linear-gradient(135deg,var(--spec-amber),var(--spec-red));border-color:transparent;color:#150a04}
  .day[data-lvl="part"]{background:rgba(224,145,63,.22);border-color:rgba(224,145,63,.32)}
  .day[data-lvl="none"]{background:rgba(191,91,84,.12);border-color:rgba(191,91,84,.3)}
  .day[data-lvl="empty"]{background:rgba(255,255,255,.02)}
  .heat-legend{font-size:10.5px;color:var(--ink-4);letter-spacing:.1em;display:flex;gap:18px;align-items:center;flex-wrap:wrap;text-transform:uppercase}
  .lg{display:inline-flex;align-items:center;gap:6px}
  .lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .breakdown{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
  .bd-row{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:11px;font-weight:300}
  .bd-bar{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
  .bd-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--spec-amber),var(--spec-red));border-radius:4px}
  .bd-row .pc{font-size:10px;color:var(--ink-4);width:38px;text-align:right;font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}

  /* ============ CATEGORIES ============ */
  .cat{margin-bottom:46px;animation:rise .6s var(--ease) backwards}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1}}
  .cat-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;padding:0 4px;flex-wrap:wrap}
  .cat-head .chip{width:3px;height:30px;border-radius:3px;background:var(--cat,var(--spec-amber));box-shadow:0 0 16px 1px var(--cat-glow,rgba(224,145,63,.5))}
  .cat-head h3{font-size:22px;font-weight:200;flex:0 1 auto;outline:none;min-width:80px;letter-spacing:.07em}
  .cat-head h3:focus{color:var(--ink)}
  .cat-head .cat-due-wrap{flex:0 0 auto}
  .cat-head .cat-prog{margin-left:auto}
  .cal-toggle{display:flex;gap:7px;align-items:center}
  .cal-toggle .cl{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-4);margin-right:5px}
  .cal-btn{font-size:10px;padding:6px 13px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--ink-3);cursor:pointer;font-family:inherit;transition:.18s;letter-spacing:.1em;text-transform:uppercase}
  .cal-btn:hover{color:var(--ink-2)}
  .cal-btn.active[data-cal="low"]{background:var(--cal-low);border-color:transparent;color:#0c1a11;font-weight:500}
  .cal-btn.active[data-cal="mid"]{background:var(--cal-mid);border-color:transparent;color:#1f1503;font-weight:500}
  .cal-btn.active[data-cal="high"]{background:var(--cal-high);border-color:transparent;color:#1f0a08;font-weight:500}
  .cat-head .count{font-size:10.5px;color:var(--ink-4);letter-spacing:.16em;font-family:"Roboto Mono",monospace}
  .cat-head .del{font-size:10.5px;color:var(--ink-4);cursor:pointer;letter-spacing:.14em;text-transform:uppercase}
  .cat-head .del:hover{color:var(--cal-high)}
  /* header "+ 目標" — desktop uses the big NEW GOAL card instead, so hide this here */
  .cat-head .add-goal-h{display:none}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}

  .card{padding:24px;position:relative;overflow:hidden;transition:transform .3s var(--ease),border-color .3s;
    border:1px solid var(--line)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cat,var(--spec-amber));opacity:.8}
  .card:hover{transform:translateY(-4px);border-color:var(--line-2)}
  .card.dragging{opacity:.35;transform:scale(.97)}
  .card.over{box-shadow:0 0 0 1px var(--ink-3) inset}
  .card.done::after{content:"COMPLETE";position:absolute;top:18px;right:-34px;transform:rotate(45deg);z-index:2;
    background:linear-gradient(96deg,var(--spec-amber),var(--spec-red));color:#150a04;font-size:9px;font-weight:600;letter-spacing:.22em;padding:4px 38px}
  .card-top{display:flex;gap:16px;align-items:flex-start}
  .grip{flex:0 0 auto;cursor:grab;color:var(--ink-4);padding-top:6px;user-select:none;font-size:13px;letter-spacing:1px;line-height:1}
  .grip:active{cursor:grabbing}
  .ring{flex:0 0 auto;position:relative;width:62px;height:62px}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:200;color:var(--ink);font-family:"Roboto Mono",monospace}
  .card-title{flex:1;min-width:0}
  .card-title .name{font-size:16px;font-weight:300;line-height:1.4;word-break:break-word;outline:none;letter-spacing:.02em}
  .card-title .name:focus{color:var(--ink)}
  .card-title .meta{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-4);margin-top:9px;font-family:"Roboto Mono",monospace}

  .slider-row{margin:20px 0 6px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;width:100%;cursor:pointer;
    background:linear-gradient(90deg,var(--cat,var(--spec-amber)) var(--p,0%),rgba(255,255,255,.1) var(--p,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);border:none;box-shadow:0 0 0 4px rgba(0,0,0,.4);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ink);border:none;cursor:pointer}
  .slider-row.auto{display:flex;align-items:center;gap:11px}
  .auto-bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
  .auto-bar i{display:block;height:100%;border-radius:3px;background:var(--cat,var(--spec-amber));transition:width .4s var(--ease)}
  .auto-note{font-size:9.5px;letter-spacing:.1em;color:var(--ink-4);white-space:nowrap}

  .checks{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .clab{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-4);font-weight:400;margin-bottom:11px}
  .check{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:var(--ink-2);font-weight:300}
  .check .box{width:16px;height:16px;border-radius:5px;border:1.4px solid var(--line-2);flex:0 0 auto;cursor:pointer;position:relative;transition:.18s}
  .check .box:hover{border-color:var(--spec-amber)}
  .check.on .box{background:linear-gradient(135deg,var(--spec-amber),var(--spec-red));border-color:transparent}
  .check.on .box::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #150a04;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .check.on .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
  .check .t{flex:1;outline:none;letter-spacing:.02em}
  .check .t:focus{color:var(--ink)}
  .check .x{opacity:0;color:var(--ink-4);cursor:pointer;font-size:12px;transition:.18s}
  .check:hover .x{opacity:1}
  .check .x:hover{color:var(--cal-high)}
  .check .star{cursor:pointer;font-size:11px;color:var(--ink-4);transition:.18s;line-height:1;flex:0 0 auto}
  .check .star:hover{color:var(--spec-amber)}
  .check .star.on{color:var(--spec-amber)}
  .add-check{display:inline-block;margin-top:18px;font-size:10.5px;color:var(--ink-4);cursor:pointer;letter-spacing:.14em;text-transform:uppercase;transition:.18s;font-weight:400}
  .add-check:hover{color:var(--spec-amber)}

  /* ============ TODAY panel ============ */
  .today{padding:32px;margin-bottom:16px}
  .today-head{display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin-bottom:26px}
  .today-head .ring-big{position:relative;width:120px;height:120px;flex:0 0 auto}
  .today-head .ring-big svg{transform:rotate(-90deg)}
  .today-head .ring-big .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .today-head .ring-big .center .num{font-size:32px;font-weight:100;color:var(--ink)}
  .today-head .ring-big .center .cap{font-size:9.5px;letter-spacing:.34em;color:var(--ink-3);text-transform:uppercase;margin-top:5px}
  .today-head .title{flex:1;min-width:200px}
  .today-head .title .k{font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
  .today-head .title h2{font-size:25px;font-weight:200;margin-top:10px;letter-spacing:.05em}
  .today-head .title .sub{font-size:12px;color:var(--ink-3);margin-top:10px;letter-spacing:.06em;font-family:"Roboto Mono",monospace;font-weight:300}
  .today-list{display:flex;flex-direction:column;gap:10px}
  .td-item{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:var(--panel);transition:.2s var(--ease);min-width:0;overflow:hidden}
  .td-item.on{background:rgba(224,145,63,.07);border-color:rgba(224,145,63,.28)}
  .td-item.just-done{animation:tdPop .42s var(--ease)}
  @keyframes tdPop{
    0%{transform:scale(1)}
    30%{transform:scale(1.022);background:rgba(224,145,63,.16);border-color:rgba(224,145,63,.5)}
    100%{transform:scale(1)}
  }
  .td-item.just-done .box{animation:boxPop .42s var(--ease)}
  @keyframes boxPop{0%{transform:scale(.6)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
  .metric .val.bump{animation:valBump .45s var(--ease)}
  @keyframes valBump{0%{transform:scale(1)}35%{transform:scale(1.18);filter:brightness(1.25)}100%{transform:scale(1)}}
  .td-item .box{width:19px;height:19px;border-radius:6px;border:1.4px solid var(--line-2);flex:0 0 auto;cursor:pointer;position:relative;transition:.18s}
  .td-item .box:hover{border-color:var(--spec-amber)}
  .td-item.on .box{background:linear-gradient(135deg,var(--spec-amber),var(--spec-red));border-color:transparent}
  .td-item.on .box::after{content:"";position:absolute;left:6px;top:2px;width:4px;height:10px;border:solid #150a04;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .td-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .td-text .t{font-size:13.5px;font-weight:300;color:var(--ink);letter-spacing:.02em}
  .td-item.on .td-text .t{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--ink-4)}
  .td-text .src{font-size:10.5px;letter-spacing:.06em;color:var(--ink-4);font-family:"Roboto Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .td-item .star{cursor:pointer;font-size:14px;color:var(--spec-amber);flex:0 0 auto;transition:.18s}
  .td-item .star:hover{filter:brightness(1.3)}
  .today-empty{padding:30px 8px;text-align:center;color:var(--ink-3);font-size:13px;font-weight:300;line-height:1.9;letter-spacing:.03em}
  .today-empty .star-ex{color:var(--spec-amber)}

  /* today-head simple (リング無し) */
  .today-head.simple{margin-bottom:20px}
  .today-head.simple .title h2{font-size:23px}
  .today-head.simple .td-big{font-size:26px;font-weight:200;letter-spacing:.14em;color:var(--ink);text-transform:uppercase}
  .today-head.simple .td-big + .sub{margin-top:10px}

  /* 今日の予定（読み取り専用） */
  .td-events{margin-bottom:18px;border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:14px 16px}
  .td-sub{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-4);font-weight:400;margin-bottom:11px}
  .td-ev{display:flex;align-items:baseline;gap:14px;padding:5px 0;font-weight:300}
  .td-ev .te-time{font-family:"Roboto Mono",monospace;font-size:11.5px;color:var(--spec-amber);letter-spacing:.04em;flex:0 0 auto;min-width:46px}
  .td-ev .te-title{font-size:13.5px;color:var(--ink-2);letter-spacing:.02em}

  /* 単発タスク入力欄 */
  .td-add{display:flex;gap:9px;margin-bottom:16px}
  .td-add-in{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    padding:12px 15px;font-size:13.5px;font-family:inherit;font-weight:300;letter-spacing:.02em}
  .td-add-in:focus{outline:none;border-color:var(--line-2)}
  .td-add-in::placeholder{color:var(--ink-4)}
  .td-add-btn{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);border-radius:11px;
    padding:0 20px;font-size:11.5px;font-family:inherit;cursor:pointer;letter-spacing:.12em;transition:.2s var(--ease);font-weight:400}
  .td-add-btn:hover{border-color:var(--ink-2);color:var(--ink);background:rgba(255,255,255,.03)}

  /* 着手中フラグ（▸） */
  .td-item .play,.check .play{cursor:pointer;font-size:13px;color:var(--ink-4);flex:0 0 auto;transition:.18s;line-height:1}
  .td-item .play:hover,.check .play:hover{color:var(--spec-amber)}
  .td-item .play.on,.check .play.on{color:var(--spec-amber)}
  .td-item.active{border-color:rgba(224,145,63,.45);background:rgba(224,145,63,.05)}
  .check.active{box-shadow:-2px 0 0 var(--spec-amber)}
  .td-item .x{opacity:0;cursor:pointer;color:var(--ink-4);font-size:12px;transition:.18s;flex:0 0 auto}
  .td-item:hover .x{opacity:1}
  .td-item .x:hover{color:var(--cal-high)}
  .td-item .td-text .t[contenteditable]:focus{outline:none;color:var(--ink)}

  /* カレンダー: 過去日を沈める */
  .cal-cell.past{opacity:.4}
  .cal-cell.past:hover{opacity:.7}

  /* 完了済み単発タスク（当日はクロスアウトで残す） */
  .td-item.on{opacity:.45;background:var(--panel)}
  .td-item.on .td-text .t{text-decoration:line-through;text-decoration-color:var(--ink-4);color:var(--ink-3)}
  .td-item.on .box{background:linear-gradient(135deg,var(--spec-amber),var(--spec-red));border-color:transparent}
  .td-item.on .box::after{content:"";position:absolute;left:6px;top:2px;width:4px;height:10px;border:solid #150a04;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .td-item.on:hover{opacity:.7}

  /* カウンターから追加する導線（今日やること内） */
  .td-counter-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tcp-lab{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4);font-weight:400}
  .tcp-chip{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);border-radius:9px;
    padding:7px 13px;font-size:12px;font-family:inherit;cursor:pointer;letter-spacing:.04em;transition:.18s var(--ease);font-weight:300}
  .tcp-chip:hover{border-color:var(--spec-amber);color:var(--ink);background:rgba(224,145,63,.06)}

  /* クリック可能メトリクス */
  .metric.clickable{cursor:pointer;transition:.2s var(--ease)}
  .metric.clickable:hover{border-color:var(--line-2);background:var(--panel-2)}
  .metric .metric-hint{font-size:8.5px;letter-spacing:.12em;color:var(--ink-4);margin-top:8px;text-transform:uppercase}

  /* ---- streak badge & weekly mini bars ---- */
  .streak-badge{margin-top:9px;display:inline-flex;align-items:center;font-size:11px;letter-spacing:.04em;color:var(--spec-amber);
    background:rgba(224,145,63,.12);border:1px solid rgba(224,145,63,.3);border-radius:20px;padding:3px 10px;font-weight:400}
  .wk-bars{display:grid;grid-template-columns:repeat(7,1fr);align-items:stretch;gap:5px;margin-top:11px}
  .wk-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
  .wk-bar .bar-track{height:46px;display:flex;align-items:flex-end;justify-content:center;width:100%}
  .wk-bar span{display:block;width:60%;max-width:12px;border-radius:3px;background:var(--line-2);transition:height .4s var(--ease),background .2s;height:4px}
  .wk-bar.has span{background:linear-gradient(180deg,var(--spec-amber),var(--spec-red))}
  .wk-bar.is-today span{box-shadow:0 0 8px 1px rgba(224,145,63,.4)}
  .wk-bar b{font-size:8px;font-weight:400;color:var(--ink-4);letter-spacing:0;line-height:1;flex:0 0 auto}
  .wk-bar.is-today b{color:var(--spec-amber)}

  /* カウンター群 */
  .counters-wrap{margin-bottom:30px}
  .counters-head{font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin:0 2px 16px;display:flex;align-items:center;gap:16px}
  .counters-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
  .counters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,150px));gap:12px}
  .counter-chip{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:14px 14px 12px;
    display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(14px)}
  .cc-name{font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:300;outline:none;word-break:break-word}
  .cc-name:focus{color:var(--ink)}
  .cc-count{font-size:28px;font-weight:100;color:var(--ink);line-height:1;letter-spacing:.01em}
  .cc-count small{font-size:12px;color:var(--ink-3);font-weight:300;margin-left:3px}
  .cc-ctrl{display:flex;align-items:center;gap:6px;margin-top:2px}
  .cc-btn{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);border-radius:7px;
    width:27px;height:25px;font-size:14px;font-family:inherit;cursor:pointer;transition:.16s;display:flex;align-items:center;justify-content:center;line-height:1}
  .cc-btn:hover{border-color:var(--spec-amber);color:var(--ink);background:rgba(224,145,63,.06)}
  .cc-del{margin-left:auto;color:var(--ink-4);cursor:pointer;font-size:11px;transition:.16s}
  .cc-del:hover{color:var(--cal-high)}
  .counter-add{display:flex;align-items:center;justify-content:center;border:1px dashed var(--line-2);border-radius:13px;
    color:var(--ink-4);font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.22s var(--ease);min-height:90px;text-align:center;padding:10px}
  .counter-add:hover{border-color:var(--ink-3);color:var(--ink-2);background:rgba(255,255,255,.015)}

  /* 達成内容パネル */
  .ap-modal{max-width:420px}
  .ap-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
  .ap-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-weight:300}
  .ap-row:last-child{border-bottom:none}
  .ap-name{font-size:13.5px;color:var(--ink-2);letter-spacing:.02em;word-break:break-word}
  .ap-count{font-size:12px;color:var(--spec-amber);font-family:"Roboto Mono",monospace;flex:0 0 auto}
  .ap-empty{padding:24px 6px;text-align:center;color:var(--ink-3);font-size:13px;font-weight:300;line-height:1.8}
  .ap-note{font-size:10.5px;color:var(--ink-4);letter-spacing:.04em;margin-top:14px;line-height:1.6}

  .notes{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .nlab{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--cal-mid);font-weight:400;margin-bottom:11px}
  .card-foot{display:flex;justify-content:flex-end;margin-top:16px}
  .meta.due{color:var(--cal-mid);margin-top:2px}
  .cat-due{font-size:11px;color:var(--cal-mid);letter-spacing:.06em;font-family:"Roboto Mono",monospace;font-weight:300}
  .del-g{font-size:10px;color:var(--ink-4);cursor:pointer;letter-spacing:.16em;text-transform:uppercase}
  .del-g:hover{color:var(--cal-high)}

  /* ---- goal due (タイトル下インライン) ---- */
  .goal-due-inline{display:flex;align-items:center;gap:8px;margin-top:5px;position:relative}
  .due-input-inline{position:absolute;opacity:0;width:1px;height:1px;inset:auto;pointer-events:none}
  .due-badge-inline{font-size:11px;font-family:"Roboto Mono",monospace;color:var(--spec-amber);letter-spacing:.06em;cursor:pointer;position:relative;z-index:1}
  .due-badge-inline.muted{color:var(--ink-4);font-size:10.5px}
  /* ---- cat due (プロジェクト締め切り) ---- */
  .cat-due-wrap{position:relative;display:flex;align-items:center}
  .cat-due-input{position:absolute;opacity:0;width:1px;height:1px;inset:auto;pointer-events:none}
  .cat-due-label{font-size:13px;font-family:"Roboto Mono",monospace;color:var(--spec-amber);letter-spacing:.06em;cursor:pointer;padding:4px 10px;border:1px solid rgba(224,145,63,.35);border-radius:8px;white-space:nowrap;position:relative;z-index:1}

  /* ---- 締め切りミニカレンダー（自前・世界観踏襲） ---- */
  .due-picker{position:absolute;z-index:200;width:288px;padding:16px;border-radius:16px;
    background:rgba(16,14,11,.82);border:1px solid var(--line-2);
    backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%);
    box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset;}
  .due-picker::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:radial-gradient(120% 90% at 18% 0%, rgba(224,145,63,.10), transparent 55%),
               radial-gradient(120% 90% at 90% 100%, rgba(46,90,143,.10), transparent 55%);}
  .due-picker>*{position:relative;z-index:1}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .dp-month{font-size:14px;font-weight:300;letter-spacing:.06em;color:var(--ink);font-family:"Roboto Mono",monospace}
  .dp-nav{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);border-radius:8px;width:30px;height:28px;font-size:15px;cursor:pointer;font-family:inherit;transition:.16s}
  .dp-nav:hover{border-color:var(--spec-amber);color:var(--ink);background:rgba(224,145,63,.08)}
  .dp-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
  .dp-dow{text-align:center;font-size:10.5px;letter-spacing:.04em;color:var(--ink-3);font-weight:400;padding:2px 0}
  .dp-dow.sun{color:var(--cal-high)} .dp-dow.sat{color:var(--spec-blue)}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dp-cell{height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:300;
    color:var(--ink-2);border-radius:9px;cursor:pointer;font-family:"Roboto Mono",monospace;transition:.14s var(--ease)}
  .dp-cell:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .dp-cell.blank{cursor:default}
  .dp-cell.blank:hover{background:transparent}
  .dp-cell.dp-today{color:var(--spec-amber)}
  .dp-cell.sel{background:linear-gradient(135deg,var(--spec-amber),var(--spec-red));color:#150a04;font-weight:500;border:none}
  .dp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .dp-clear{background:transparent;border:1px solid var(--line-2);color:var(--ink-3);border-radius:8px;padding:7px 14px;font-size:11px;font-family:inherit;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;transition:.16s}
  .dp-clear:hover{border-color:var(--cal-high);color:var(--cal-high)}
  .dp-close{background:transparent;border:none;color:var(--ink-3);font-size:11px;font-family:inherit;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;transition:.16s}
  .dp-close:hover{color:var(--ink)}
  .add-goal{display:flex;align-items:center;justify-content:center;gap:9px;min-height:130px;cursor:pointer;
    border:1px dashed var(--line-2);border-radius:var(--r);color:var(--ink-4);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;transition:.25s var(--ease)}
  .add-goal:hover{border-color:var(--ink-3);color:var(--ink-2);background:rgba(255,255,255,.015)}

  footer{margin-top:64px;padding-top:22px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-4);
    letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-family:"Roboto Mono",monospace}

  .modal-bg{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
  .modal-bg.show{display:flex}
  .modal{padding:32px;width:100%;max-width:400px}
  .modal h4{font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:20px;font-weight:400;color:var(--ink-2)}
  .modal input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:14px;font-size:14px;margin-bottom:20px;font-family:inherit;font-weight:300}
  .modal input:focus{outline:none;border-color:var(--line-2)}
  .modal .row{display:flex;gap:10px;justify-content:flex-end}

  /* ---- day detail popup ---- */
  .dm-empty{font-size:13px;color:var(--ink-3);line-height:1.6;padding:6px 2px 4px;letter-spacing:.02em}
  .dm-item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;
    background:var(--panel);padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:.16s var(--ease)}
  .dm-item:hover{border-color:var(--line-2);background:rgba(255,255,255,.025)}
  .dm-when{font-family:"Roboto Mono",monospace;font-size:11px;color:var(--spec-amber);letter-spacing:.04em;flex:0 0 auto;min-width:42px;padding-top:1px}
  .dm-item.memo .dm-when{color:var(--cal-low)}
  .dm-body{flex:1;min-width:0}
  .dm-title{font-size:14px;color:var(--ink);font-weight:300;letter-spacing:.02em;word-break:break-word}
  .dm-memo{font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .dm-tags{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .dm-tag{font-size:9.5px;letter-spacing:.1em;color:var(--ink-4);text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 7px}

  /* ---- per-task difficulty toggle (inside card) ---- */
  .cal-row{display:flex;align-items:center;gap:11px;margin-top:16px}
  .cal-lab{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-4);font-weight:400}
  .cal-toggle{display:flex;gap:6px;align-items:center}
  .cal-toggle .cl{display:none}

  /* ---- category difficulty tally (in cat header) ---- */
  .cat-tally{display:flex;gap:14px;align-items:center;margin-left:auto;flex-wrap:wrap}
  .tally{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);letter-spacing:.08em;font-weight:300}
  .tally i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .cat-head .count{margin-left:18px}

  /* ---- metrics: by-difficulty split ---- */
  .diff-split{display:flex;gap:16px;margin-top:16px;align-items:baseline}
  .diff-split .ds{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:300;letter-spacing:.04em}
  .diff-split .ds i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .diff-split .ds b{font-size:22px;font-weight:100;color:var(--ink);letter-spacing:0}

  /* ============ tabs ============ */
  .head-right{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
  .tabs{display:flex;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--panel)}
  .tab{background:transparent;border:none;color:var(--ink-3);font-family:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:9px 20px;border-radius:8px;cursor:pointer;transition:.22s var(--ease);font-weight:400}
  .tab:hover{color:var(--ink-2)}
  .tab.active{background:linear-gradient(96deg,var(--spec-amber),var(--spec-red));color:#1a0d06;font-weight:500}

  /* ============ upcoming events banner ============ */
  .upcoming{display:flex;align-items:stretch;gap:0;margin-bottom:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);backdrop-filter:blur(16px);overflow:hidden}
  .up-label{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:16px 26px;border-right:1px solid var(--line);min-width:172px}
  .up-label .k{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
  .up-label .ic{font-size:21px;font-weight:100;color:var(--ink);letter-spacing:.04em}
  .up-label .up-big{font-size:26px;font-weight:200;letter-spacing:.14em;color:var(--ink);text-transform:uppercase}
  .up-list{flex:1;display:flex;gap:0;overflow-x:auto}
  .up-item{flex:0 0 auto;min-width:182px;padding:15px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:.2s}
  .up-item:last-child{border-right:none}
  .up-item:hover{background:rgba(255,255,255,.02)}
  .up-when{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--spec-amber)}
  .up-when .rel{color:var(--ink-4);margin-left:7px}
  .up-title{font-size:14px;font-weight:300;color:var(--ink);letter-spacing:.02em;line-height:1.4}
  .up-empty{flex:1;display:flex;align-items:center;padding:0 26px;color:var(--ink-4);font-size:13px;font-weight:300;letter-spacing:.04em}

  /* ============ calendar ============ */
  .cal-nav{display:flex;align-items:center;gap:12px}
  .cal-month{font-size:20px;font-weight:200;letter-spacing:.08em;min-width:160px;text-align:center;cursor:pointer;border-radius:9px;padding:4px 6px;transition:.16s var(--ease)}
  .cal-month:hover{background:rgba(255,255,255,.04);color:var(--spec-amber)}

  /* ---- month/year picker popup ---- */
  .mp-year{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .mp-year .mp-y{font-size:22px;font-weight:200;letter-spacing:.06em;color:var(--ink)}
  .mp-year button{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);border-radius:9px;
    width:38px;height:34px;font-size:16px;font-family:inherit;cursor:pointer;transition:.16s;display:flex;align-items:center;justify-content:center}
  .mp-year button:hover{border-color:var(--spec-amber);color:var(--ink)}
  .mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mp-m{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink-2);
    padding:14px 0;font-size:14px;font-family:inherit;font-weight:300;cursor:pointer;transition:.16s var(--ease);letter-spacing:.04em}
  .mp-m:hover{border-color:var(--line-2);background:rgba(255,255,255,.03);color:var(--ink)}
  .mp-m.cur{border-color:var(--spec-amber);background:rgba(224,145,63,.1);color:var(--spec-amber)}
  .calendar{padding:24px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:120px;gap:8px}
  .cal-dow-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:6px}
  .cal-dow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);text-align:center;padding:2px 0;font-weight:400}
  .cal-dow.sun{color:var(--cal-high)}
  .cal-dow.sat{color:var(--spec-blue)}
  .cal-cell{height:100%;border:1px solid var(--line);border-radius:11px;padding:8px;background:var(--panel);display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:.18s var(--ease);position:relative;overflow:hidden}
  .cal-cell:hover{border-color:var(--line-2);background:rgba(255,255,255,.025)}
  .cal-cell.blank{background:transparent;border-color:transparent;cursor:default}
  .cal-cell.blank:hover{background:transparent}
  .cal-cell.today{border-color:var(--spec-amber);background:rgba(224,145,63,.06)}
  /* 祝日：日付を赤系に、右下に祝日名を小さく */
  .cal-cell.holiday .cal-date{color:var(--cal-high)}
  .cal-hol{position:absolute;right:6px;bottom:5px;max-width:calc(100% - 12px);font-size:9px;line-height:1.2;font-weight:400;
    color:var(--cal-high);letter-spacing:.02em;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:1;pointer-events:none}
  .cal-date{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--ink-2);font-weight:300}
  .cal-cell.today .cal-date{color:var(--spec-amber)}
  .cal-date-row{display:flex;align-items:center;justify-content:space-between;gap:4px}
  .memo-marks{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
  .memo-dot{font-size:12px;color:var(--cal-low);cursor:pointer;line-height:1;transition:.15s}
  .memo-dot:hover{color:var(--spec-amber);filter:brightness(1.3)}
  .cal-ev{font-size:10.5px;line-height:1.3;color:var(--ink);background:linear-gradient(96deg,rgba(224,145,63,.22),rgba(184,68,62,.18));border-left:2px solid var(--spec-amber);border-radius:4px;padding:2px 6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.15s}
  .cal-ev:hover{filter:brightness(1.2)}
  .cal-ev .t{font-family:"Roboto Mono",monospace;font-size:10px;color:var(--spec-amber);margin-right:4px}
  .cal-more{font-size:10px;color:var(--ink-4);letter-spacing:.04em}

  /* event modal extras */
  .modal input[type=date],.modal input[type=time]{font-family:"Roboto Mono",monospace;color-scheme:dark}
  .ev-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
  .ev-del{font-size:10px;color:var(--ink-4);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;background:none;border:none;font-family:inherit}
  .ev-del:hover{color:var(--cal-high)}

  /* ---- event type toggle ---- */
  .type-toggle{display:flex;gap:6px;margin-bottom:20px;border:1px solid var(--line);border-radius:11px;padding:4px;background:rgba(0,0,0,.2)}
  .ty-btn{flex:1;background:transparent;border:none;color:var(--ink-3);font-family:inherit;font-size:12px;padding:9px;border-radius:8px;cursor:pointer;transition:.2s;letter-spacing:.06em}
  .ty-btn.active{background:linear-gradient(96deg,var(--spec-amber),var(--spec-red));color:#1a0d06;font-weight:500}
  .modal label{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px;font-weight:400}
  .modal select{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:12px;font-size:13px;font-family:inherit;font-weight:300;color-scheme:dark}
  .modal select:focus{outline:none;border-color:var(--line-2)}
  .modal select option{background:#15110d;color:var(--ink)}

  /* ---- category reorder + project progress ---- */
  .cat-order{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
  .cat-order .ord{background:transparent;border:1px solid var(--line);color:var(--ink-3);border-radius:6px;width:24px;height:18px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s;padding:0}
  .cat-order .ord:hover{border-color:var(--ink-2);color:var(--ink)}
  .cat-order .ord.off{opacity:.25;pointer-events:none}
  .cat-prog{display:flex;align-items:center;gap:9px;margin-left:4px}
  .cat-prog .cp-bar{width:88px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
  .cat-prog .cp-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--spec-amber),var(--spec-red));transition:width .4s var(--ease)}
  .cat-prog .cp-num{font-size:12px;color:var(--ink-2);font-family:"Roboto Mono",monospace;font-weight:300;min-width:34px}

  /* ---- memo-type event in calendar ---- */
  .cal-ev.memo{background:linear-gradient(96deg,rgba(95,143,107,.22),rgba(47,111,114,.18));border-left-color:var(--cal-low)}
  .cal-ev.memo .t{color:var(--cal-low)}
  .cal-ev .rep{font-size:9px;color:var(--spec-amber);margin-right:3px}

  /* ============================================================
     RESPONSIVE — phones (<= 700px)
     ============================================================ */
  @media (max-width:700px){
    body{padding:20px 14px 70px}
    .wrap{max-width:100%}

    header.bar{margin-bottom:26px;gap:14px}
    .brand h1{font-size:28px;letter-spacing:.1em}
    .brand .kicker{font-size:10px;letter-spacing:.32em}
    .head-right{flex-direction:row;align-items:center;justify-content:space-between;width:100%;gap:10px}
    .clock{font-size:10px;line-height:1.7;text-align:left}
    .tabs{flex:0 0 auto}
    .tab{padding:8px 16px;font-size:10px}

    .upcoming{flex-direction:column;margin-bottom:26px}
    .up-label{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;min-width:0;width:100%;border-right:none;border-bottom:1px solid var(--line);padding:14px 18px}
    .up-label .ic{font-size:18px}
    .up-label .up-big{font-size:16px;letter-spacing:.18em}
    .up-item{min-width:150px;padding:14px 16px}

    .metrics{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
    .metric{padding:14px 14px 13px}
    .metric .lab{font-size:8.5px;letter-spacing:.16em}
    .metric .val{font-size:27px;margin-top:7px}
    .metric .val small{font-size:11px}
    .wk-bars{height:38px;gap:4px;margin-top:9px}
    .streak-badge{font-size:10px;padding:2px 8px;margin-top:7px}

    .counters-grid{grid-template-columns:repeat(auto-fill,minmax(108px,132px));gap:10px;justify-content:start}
    .counter-chip{padding:13px 13px 11px;gap:7px}
    .cc-count{font-size:25px}
    .counter-add{min-height:78px}
    .diff-split{gap:10px;margin-top:10px}
    .diff-split .ds b{font-size:17px}
    .diff-split .ds{font-size:11px}

    .echo{padding:15px 18px;margin-bottom:30px;font-size:13px}
    .sec-title{font-size:10.5px;letter-spacing:.28em;margin:6px 2px 16px}

    .today{padding:20px}
    .today-head{gap:18px;margin-bottom:20px}
    .today-head .ring-big,.today-head .ring-big svg{width:92px;height:92px}
    .today-head .title h2{font-size:21px}
    .today-head.simple .td-big{font-size:16px;letter-spacing:.18em}
    .today-list{grid-template-columns:1fr;gap:8px}

    .toolbar{gap:10px}
    .controls{width:100%}
    .controls .btn{flex:1;text-align:center;justify-content:center;padding:10px 8px;font-size:10px}

    .cat{margin-bottom:34px}
    .cat-head{gap:10px 12px}
    .cat-head h3{font-size:19px;flex:1 1 auto;min-width:0}
    .cat-head .cat-prog{margin-left:0}
    .cat-prog .cp-bar{width:70px}
    .cat-tally{gap:10px;font-size:10px}
    .tally{font-size:10px}
    .cat-head .count,.cat-head .del{font-size:10px}
    /* mobile: move "add goal" into the header so it doesn't push the next project down */
    .cat-head .add-goal-h{display:inline;font-size:10px;color:var(--spec-amber);cursor:pointer;
      letter-spacing:.1em;border:1px solid rgba(224,145,63,.35);border-radius:7px;padding:3px 9px;white-space:nowrap}
    .cat-head .add-goal-h:active{background:rgba(224,145,63,.12)}
    .cards .add-goal{display:none}

    .cards{grid-template-columns:1fr;gap:14px}
    .card{padding:20px}

    /* full-bleed: cancel body's 14px side padding so the grid uses the whole screen width.
       drop the panel's own padding / border / background (the glass chrome) — cells keep their look. */
    .calendar{padding:0 2px;margin:0 -12px;background:none;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0}
    .calendar::before,.calendar::after{display:none}
    .cal-grid{grid-auto-rows:minmax(122px,auto);gap:1px}
    .cal-dow-row{gap:1px;margin-bottom:3px;padding:0 1px}
    .cal-cell{padding:4px 3px;border-radius:8px;gap:2px}
    .cal-date{font-size:12px}
    .cal-dow{font-size:9px;letter-spacing:.1em;padding:4px 0}
    /* events: drop the chip box, let titles wrap to 2 lines so the day is actually readable */
    .cal-ev{font-size:9.5px;line-height:1.25;padding:1px 0 1px 4px;background:none;border-left:2px solid var(--spec-amber);
      border-radius:0;white-space:normal;overflow:hidden;color:#7ea3d8;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
    .cal-cell.past{opacity:.62}
    .cal-ev.memo{background:none;border-left-color:var(--cal-low)}
    .cal-ev .t{font-size:8.5px;display:inline}
    .cal-ev .rep{display:none}      /* hide ↻ on mobile — it ate all the title width */
    .cal-hol{font-size:8px;position:static;max-width:100%;text-align:left;white-space:normal;margin-top:auto}
    .cal-month{font-size:17px;min-width:0}
    .cal-nav{gap:8px}
    .memo-dot{font-size:11px}

    .modal{padding:24px 20px}
    .type-toggle .ty-btn{font-size:11px;padding:10px 6px}
    /* iOS zooms the viewport when focusing an input under 16px — keep these at 16px to prevent it */
    .modal input,.modal select,.modal textarea{font-size:16px}
  }

  @media (max-width:380px){
    .brand h1{font-size:24px}
    .cal-grid{grid-auto-rows:minmax(104px,auto);gap:2px}
    .cal-cell{padding:4px 3px}
    .cal-ev{font-size:8.5px;padding-left:3px}
    .cal-ev .t{font-size:8px;margin-right:2px}
  }
</style>
</head>
<body>
<div class="space"><div class="stars"></div></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#e0913f"/>
    <stop offset="38%" stop-color="#b8443e"/>
    <stop offset="70%" stop-color="#3f7a5f"/>
    <stop offset="100%" stop-color="#2e5a8f"/>
  </linearGradient>
</defs></svg>
<div class="grid-lines"></div>
<div class="grain"></div>

<div class="wrap">
  <header class="bar">
    <div class="brand">
      <div class="kicker"><span class="ping"></span>personal progress console</div>
      <h1>Progress</h1>
    </div>
    <div class="head-right">
      <div class="clock-row">
        <div class="clock" id="clock">SYNCING…</div>
        <button class="sync-btn" id="syncBtn" onclick="syncNow()" title="最新データに同期（長押しで強制リロード）">⟳</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-view="tasks" onclick="setView('tasks')">Tasks</button>
        <button class="tab" data-view="calendar" onclick="setView('calendar')">Calendar</button>
      </div>
    </div>
  </header>

  <!-- UPCOMING EVENTS — always visible banner -->
  <div class="upcoming" id="upcoming"></div>

  <!-- ============ TASKS VIEW ============ -->
  <div id="view-tasks">
    <!-- TODAY -->
    <div class="today glass" id="today"></div>

    <!-- STATS -->
    <div class="metrics" id="metrics"></div>

    <!-- CATEGORIES -->
    <div class="toolbar">
      <div class="sec-title" style="margin:0">Goals</div>
      <div class="controls">
        <button class="btn" id="notifyBtn" onclick="enableNotifications()">🔔 通知を有効化</button>
        <button class="btn" onclick="openCat()">+ カテゴリ追加</button>
        <button class="btn" onclick="exportData()">⬇ バックアップ</button>
        <button class="btn" onclick="document.getElementById('imp').click()">⬆ 復元</button>
        <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(event)">
      </div>
    </div>
    <div id="board"></div>
  </div>

  <!-- ============ CALENDAR VIEW ============ -->
  <div id="view-calendar" style="display:none">
    <div class="toolbar">
      <div class="cal-nav">
        <button class="btn" onclick="calShift(-1)">‹</button>
        <div class="cal-month" id="calMonth" onclick="openMonthPick()" title="月を選んで移動">—</div>
        <button class="btn" onclick="calShift(1)">›</button>
        <button class="btn" onclick="calToday()">今日</button>
      </div>
      <button class="btn solid" onclick="openEvent()">+ 予定を追加</button>
    </div>
    <div class="calendar glass" id="calendar"></div>
  </div>

  <footer>
    <span>STORED LOCALLY · データはあなたのブラウザにのみ保存されます</span>
    <span id="lastsave">—</span>
  </footer>
</div>

<!-- EVENT MODAL -->
<div class="modal-bg" id="eventModal">
  <div class="modal glass">
    <h4 id="eventModalTitle">NEW · 追加</h4>

    <div class="type-toggle">
      <button class="ty-btn active" data-type="event" onclick="setEvType('event')">📅 予定</button>
      <button class="ty-btn" data-type="memo" onclick="setEvType('memo')">📝 記録</button>
    </div>

    <label>日付</label>
    <input type="date" id="evDate">

    <div class="ev-only">
      <label style="margin-top:14px">時刻（任意）</label>
      <input type="time" id="evTime">
    </div>

    <label style="margin-top:14px" id="evTitleLab">タイトル</label>
    <input id="evTitle" placeholder="例：通院 / 打ち合わせ / 締め切り" maxlength="80">

    <div class="ev-only">
      <label style="margin-top:14px">繰り返し</label>
      <select id="evRepeat">
        <option value="none">なし（1回だけ）</option>
        <option value="daily">毎日</option>
        <option value="weekly">毎週（この曜日）</option>
        <option value="biweekly">隔週（この曜日）</option>
        <option value="monthly">毎月（この日付）</option>
      </select>
      <div class="repeat-end" id="repeatEndWrap" style="display:none">
        <label style="margin-top:14px">繰り返しの終了（任意）</label>
        <input type="date" id="evRepeatEnd">
      </div>
      <label class="ev-check" style="margin-top:16px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--ink-2);letter-spacing:.02em">
        <input type="checkbox" id="evInToday" checked style="width:16px;height:16px;accent-color:var(--spec-amber);cursor:pointer">
        該当日の「今日やること」に表示する
      </label>
    </div>

    <label style="margin-top:14px" id="evMemoLab">メモ（任意）</label>
    <textarea id="evMemo" class="note" placeholder="場所、持ち物、気をつけること…" style="min-height:70px"></textarea>

    <div class="row" style="margin-top:18px">
      <button class="btn" onclick="closeEvent()">CANCEL</button>
      <button class="btn solid" onclick="saveEvent()">SAVE</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="dayModal">
  <div class="modal glass">
    <h4 id="dayModalTitle">DAY</h4>
    <div id="dayModalBody"></div>
    <div class="row" style="margin-top:18px;justify-content:space-between">
      <button class="btn" onclick="closeDay()">閉じる</button>
      <button class="btn solid" id="dayAddBtn">+ この日に追加</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="monthModal">
  <div class="modal glass" style="max-width:340px">
    <h4>月を選んで移動</h4>
    <div class="mp-year">
      <button onclick="mpYear(-1)">‹</button>

<script>
const STORE="progressDeck.v2";
const MSGS=[
 "今日も起動できた。それだけで前進だ。",
 "完璧じゃなくていい。1%でも動けば記録は伸びる。",
 "止まった日があっても、積み上げは消えない。",
 "小さなチェックひとつが、明日の自分を助ける。",
 "比べる相手は昨日の自分だけ。今日はもう更新している。",
 "うまくいかない点はメモに残せば十分。責めなくていい。",
 "休むのも進行の一部。回復はサボりじゃない。",
 "あなたのペースが正しいペース。"
];
const CAL_COLOR={low:["#5f8f6b","rgba(95,143,107,.45)"],mid:["#c79a52","rgba(199,154,82,.45)"],high:["#bf5b54","rgba(191,91,84,.45)"]};

// ---- "routine day" key: resets at 02:00. Anything before 2am counts as previous calendar day.
function routineDayKey(d=new Date()){
  const x=new Date(d.getTime());
  x.setHours(x.getHours()-2); // shift so 2am boundary = midnight
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}

let data=defaultData();

function defaultData(){
  return {
    routine:{
      items:[
        {id:uid(),t:"日光を浴びる"},
        {id:uid(),t:"水をしっかり飲む"},
        {id:uid(),t:"23時には画面を閉じる"}
      ],
      log:{},
      notes:{},
      currentDay:routineDayKey(),
      adhoc:[],
      achieve:{},          // dayKey -> 達成数（数値のみ・永久保持）
      achieveLog:{},       // dayKey -> [完了したタスク名...]（直近1週間のみ保持）
      eventDone:{},        // dayKey -> [完了したカレンダー予定ID...]
      counters:[           // 任意の回数カウンター（プール・図書館等）
        {id:uid(),name:"プール",count:0},
        {id:uid(),name:"図書館",count:0}
      ]
    },
    cats:[
      {id:uid(),name:"仕事",goals:[
        {id:uid(),name:"進行中のプロジェクトを一区切りまで進める",cal:"high",prog:35,note:"詰まり点：仕様の優先順位が曖昧。明日、要件を3つに絞る。",checks:[{t:"30分だけ手をつける",on:false}]},
        {id:uid(),name:"メールの返信をためない",cal:"low",prog:60,note:"",checks:[]}
      ]},
      {id:uid(),name:"私生活",goals:[
        {id:uid(),name:"生活リズムを整える",cal:"mid",prog:50,note:"",checks:[{t:"散歩する",on:false}]},
        {id:uid(),name:"部屋を片付ける",cal:"low",prog:20,note:"",checks:[]}
      ]}
    ],
    events:[]
  };
}

// Firebaseの初回ロード完了後に呼ばれる
window._onFirebaseReady = function(fbData) {
  window._firebaseReady = true;
  if(fbData && fbData.cats && fbData.routine) {
    data = migrate(fbData);
  } else {
    data = defaultData();
  }
  rolloverIfNeeded();
  render();
};
function migrate(d){
  if(!Array.isArray(d.cats)) d.cats = d.cats ? Object.values(d.cats) : [];
  d.cats.forEach(c=>{
    if(!Array.isArray(c.goals)) c.goals = c.goals ? Object.values(c.goals) : [];
    const inherited=c.cal||'mid';
    c.goals.forEach(g=>{
      if(!g.cal)g.cal=inherited;
      if(!Array.isArray(g.checks)) g.checks = g.checks ? Object.values(g.checks) : [];
    });
    delete c.cal;
  });
  if(!d.routine.log)d.routine.log={};
  if(!d.routine.notes)d.routine.notes={};
  if(!d.routine.currentDay)d.routine.currentDay=routineDayKey();
  if(!Array.isArray(d.routine.items)) d.routine.items = d.routine.items ? Object.values(d.routine.items) : [];
  if(!Array.isArray(d.routine.adhoc)) d.routine.adhoc = d.routine.adhoc ? Object.values(d.routine.adhoc) : [];
  if(!d.routine.achieve)d.routine.achieve={};
  if(!d.routine.achieveLog)d.routine.achieveLog={};
  if(!d.routine.eventDone)d.routine.eventDone={};
  if(!Array.isArray(d.routine.counters)) d.routine.counters = d.routine.counters ? Object.values(d.routine.counters) : [];
  if(!Array.isArray(d.events)) d.events = d.events ? Object.values(d.events) : [];
  pruneAchieveLog(d);   // 直近1週間より古い達成名ログを削除
  return d;
}
function uid(){return Math.random().toString(36).slice(2,9)}
let _saveTimer=null;
function save(){
  // 連続編集での書き込みを抑えるため300msデバウンス
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    _saveTimer=null;
    if(window.firebaseSave) window.firebaseSave(data);
  },300);
}
// 即時保存が必要な場面用（タブを閉じる直前など）
function saveNow(){
  if(_saveTimer){clearTimeout(_saveTimer);_saveTimer=null;}
  if(window.firebaseSave) window.firebaseSave(data);
}
window.addEventListener("beforeunload",()=>{ if(_saveTimer) saveNow(); });

// ======================================================================
// ====== 同期 / リロードボタン ======
//  タップ      → Firebaseから最新データを取り直して再描画（軽い）
//  長押し/ダブルタップ → キャッシュを無視して完全リロード（コード更新を取り込む）
// ======================================================================
let _syncing=false;
function syncNow(){
  if(_syncing) return;
  // 編集中の未保存分があれば先に書き込んでから取り直す（自分の編集を消さない）
  if(_saveTimer) saveNow();
  const btn=document.getElementById("syncBtn");
  _syncing=true; if(btn) btn.classList.add("spin");
  const clock=document.getElementById("clock");
  if(!window._fbRef){ _finishSync(btn,clock,"オフライン"); return; }
  try{
    window._fbRef.once('value', (snap)=>{
      const val=snap.val();
      if(val && val.cats && val.routine){
        data = migrate(val);
        rolloverIfNeeded();
        render();
        _finishSync(btn,clock,"SYNCED");
      }else{
        _finishSync(btn,clock,"データなし");
      }
    }, (err)=>{ console.error("sync error:",err); _finishSync(btn,clock,"同期失敗"); });
  }catch(e){ console.error(e); _finishSync(btn,clock,"同期失敗"); }
}
function _finishSync(btn,clock,msg){
  _syncing=false;
  if(btn) btn.classList.remove("spin");
  if(clock){
    const prev=clock.textContent;
    clock.textContent=msg+" · "+new Date().toLocaleTimeString("ja-JP");
  }
}
async function hardReload(){
  // Service Worker / Cache API があれば消す（PWAの古いキャッシュ対策）
  try{
    if('caches' in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister())); }
  }catch(e){ console.warn("cache clear failed",e); }
  // クエリを付けてキャッシュを確実にバイパス
  const u=new URL(location.href); u.searchParams.set("_r", Date.now());
  location.replace(u.toString());
}
// 長押し（600ms）またはダブルタップで強制リロード
(function(){
  const btn=document.getElementById("syncBtn"); if(!btn) return;
  let pressTimer=null, longFired=false, lastTap=0;
  const startPress=()=>{ longFired=false; pressTimer=setTimeout(()=>{ longFired=true; hardReload(); }, 600); };
  const cancelPress=()=>{ if(pressTimer){clearTimeout(pressTimer);pressTimer=null;} };
  btn.addEventListener("touchstart",(e)=>{ startPress(); }, {passive:true});
  btn.addEventListener("touchend",cancelPress);
  btn.addEventListener("touchmove",cancelPress);
  btn.addEventListener("mousedown",startPress);
  btn.addEventListener("mouseup",cancelPress);
  btn.addEventListener("mouseleave",cancelPress);
  // ダブルクリックでも強制リロード（PC向け）
  btn.addEventListener("dblclick",(e)=>{ e.preventDefault(); hardReload(); });
  // onclick(syncNow)が長押し後に発火しないよう、長押し時はクリックを抑制
  btn.addEventListener("click",(e)=>{ if(longFired){ e.preventDefault(); e.stopImmediatePropagation(); longFired=false; } }, true);
})();


// ---- rollover: if the routine day changed, commit yesterday's state to log
function rolloverIfNeeded(){
  const today=routineDayKey();
  if(data.routine.currentDay!==today){
    // 日付が変わった：完了済みの単発タスクを掃除（未完了は繰り越し）
    if(Array.isArray(data.routine.adhoc)){
      data.routine.adhoc=data.routine.adhoc.filter(a=>!a.on);
    }
    // 完了済みプロジェクトステップは「今日やる」から外す（未完了は繰り越し）
    (data.cats||[]).forEach(c=>(c.goals||[]).forEach(g=>(g.checks||[]).forEach(ch=>{
      if(ch.today && ch.on){ ch.today=false; ch.active=false; }
    })));
    data.routine.currentDay=today;
    // 過去日のカレンダー予定の完了記録を掃除（当日分のみ保持）
    if(data.routine.eventDone){
      Object.keys(data.routine.eventDone).forEach(k=>{ if(k<today) delete data.routine.eventDone[k]; });
    }
  }
  // ensure today's log entry exists
  if(!data.routine.log[today])data.routine.log[today]={};
  pruneAchieveLog(data);   // 直近1週間より古い達成名ログを掃除
}

// ====== RENDER ======
let _prevAchieveToday=null;        // 前回描画時のTODAY達成数
let _celebrateItemId=null;          // 直近に完了したタスクの要素ID（演出用）
function render(){
  renderToday();
  renderBoard();
  renderMetrics();
  renderUpcoming();
  renderCalendar();
  save();updateClock();
  applyCelebration();
}
// 完了演出：今日やることの完了数が増えていればTODAYの数字をポップ＆カウントアップ、完了アイテムを軽く強調
function applyCelebration(){
  const now=todayProgress().done;
  // TODAY数字のバンプ＋カウントアップ（増えたときだけ）
  if(_prevAchieveToday!==null && now>_prevAchieveToday){
    const valEl=document.querySelector(".metric.accent .val");
    if(valEl){
      countUp(valEl,_prevAchieveToday,now);
      valEl.classList.remove("bump"); void valEl.offsetWidth; valEl.classList.add("bump");
    }
  }
  _prevAchieveToday=now;
  // 完了したタスク行を一瞬強調
  if(_celebrateItemId){
    const item=document.querySelector(`[data-cel="${_celebrateItemId}"]`);
    if(item){ item.classList.add("just-done"); setTimeout(()=>item.classList.remove("just-done"),460); }
    _celebrateItemId=null;
  }
}
// 数字をfrom→toへ短時間でカウントアップ
function countUp(el,from,to){
  const dur=420, t0=performance.now();
  // <small>サフィックスは保持
  const small=el.querySelector("small"); const sufHTML=small?small.outerHTML:"";
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    const ease=1-Math.pow(1-p,3);
    const v=Math.round(from+(to-from)*ease);
    el.innerHTML=v+sufHTML;
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function todayLog(){const k=data.routine.currentDay;if(!data.routine.log[k])data.routine.log[k]={};return data.routine.log[k]}

// ====== 達成カウント（完了するたび+1・取り消しても減らさない） ======
// nameを渡すと、その完了名を当日ログにも記録する（直近1週間だけ保持）
function bumpAchieve(name){
  const k=routineDayKey();
  data.routine.achieve[k]=(data.routine.achieve[k]||0)+1;
  if(name){
    if(!data.routine.achieveLog[k])data.routine.achieveLog[k]=[];
    data.routine.achieveLog[k].push(name);
  }
}
// 取り消し：その日の達成数を-1、ログから該当名を1件だけ削除
function unbumpAchieve(name){
  const k=routineDayKey();
  data.routine.achieve[k]=Math.max(0,(data.routine.achieve[k]||0)-1);
  if(name && data.routine.achieveLog[k]){
    const arr=data.routine.achieveLog[k];
    const i=arr.lastIndexOf(name);
    if(i>=0)arr.splice(i,1);
    if(arr.length===0)delete data.routine.achieveLog[k];
  }
}
// 直近7日（routineDay基準）より古い達成名ログを捨てる。数値achieveは残す。
function pruneAchieveLog(d){
  const log=d.routine.achieveLog; if(!log)return;
  const todayK=routineDayKey();
  const cutoff=new Date(todayK+"T00:00:00"); cutoff.setDate(cutoff.getDate()-6); // 今日含め7日
  for(const k in log){
    const day=new Date(k+"T00:00:00");
    if(day<cutoff) delete log[k];
  }
}
// 週キー: その日が属する週（月曜始まり）の基準日。routineDayベース。
function weekStartKey(dayKey){
  const d=new Date(dayKey+"T00:00:00");
  const dow=(d.getDay()+6)%7; // 月=0..日=6
  d.setDate(d.getDate()-dow);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// 今日やること（プロジェクトの「今日やる」ステップ＋単発タスク＋当日のカレンダー予定）の
// 完了数 / 総数。renderToday と同じ構成で数える。ステップを足せば total が増え、消せば減る。
function todayProgress(){
  const todayK=dateKey(new Date());
  let done=0,total=0;
  // プロジェクトの「今日やる」ステップ
  (data.cats||[]).forEach(c=>(c.goals||[]).forEach(g=>(g.checks||[]).forEach(ch=>{
    if(ch.today){ total++; if(ch.on) done++; }
  })));
  // 単発タスク
  (data.routine.adhoc||[]).forEach(a=>{ total++; if(a.on) done++; });
  // 当日のカレンダー予定
  const doneToday=(data.routine.eventDone&&data.routine.eventDone[todayK])||[];
  (data.events||[]).forEach(e=>{
    if((e.kind||"event")==="event" && e.inToday!==false && occursOn(e,todayK)){
      total++; if(doneToday.includes(e.id)) done++;
    }
  });
  return {done,total};
}
function achieveStats(){
  const ach=data.routine.achieve||{};
  const todayK=routineDayKey();
  const wk=weekStartKey(todayK);
  let total=0,today=0,week=0;
  for(const k in ach){
    const n=ach[k]||0;
    total+=n;
    if(k===todayK)today+=n;
    if(weekStartKey(k)===wk)week+=n;
  }
  return {total,today,week};
}
// 連続達成日数：今日(または昨日)から遡って「1件以上達成した日」が何日続いているか。
// 今日まだ0件でも、昨日までの連続が途切れていなければその日数を返す（今日やればそのまま伸びる）。
function streakDays(){
  const ach=data.routine.achieve||{};
  const has=k=>(ach[k]||0)>0;
  const d=new Date(routineDayKey()+"T00:00:00");
  // 起点：今日が0件なら昨日から数える
  if(!has(routineDayKey())) d.setDate(d.getDate()-1);
  let count=0;
  while(true){
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(has(k)){count++;d.setDate(d.getDate()-1);}else break;
  }
  return count;
}
// 今週(月曜始まり)の曜日別達成数 [月,火,水,木,金,土,日]
function weekByDay(){
  const ach=data.routine.achieve||{};
  const wk=weekStartKey(routineDayKey());
  const base=new Date(wk+"T00:00:00");
  const out=[];
  for(let i=0;i<7;i++){
    const d=new Date(base); d.setDate(base.getDate()+i);
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    out.push(ach[k]||0);
  }
  return out;
}
// 今日 / 今週 完了したタスク名の一覧（achieveLogから。1週間保持なので両方取れる）
function achieveNames(scope){
  const log=data.routine.achieveLog||{};
  const todayK=routineDayKey();
  const wk=weekStartKey(todayK);
  const out=[];
  for(const k in log){
    const inScope = scope==="today" ? (k===todayK) : (weekStartKey(k)===wk);
    if(inScope) (log[k]||[]).forEach(n=>out.push(n));
  }
  return out;
}

function renderToday(){
  const el=document.getElementById("today"); if(!el)return;

  // --- 今日の予定（event種別のみ・読み取り専用） ---
  const todayK=dateKey(new Date());
  const todayEvents=data.events
    .filter(e=>(e.kind||"event")==="event" && e.inToday!==false && occursOn(e,todayK))
    .sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));

  // --- プロジェクトの「今日やる」ステップ ---
  const steps=[];
  data.cats.forEach(c=>c.goals.forEach(g=>{
    (g.checks||[]).forEach((ch,i)=>{
      if(ch.today) steps.push({cid:c.id, gid:g.id, idx:i, cat:c.name, goal:g.name, ch});
    });
  }));

  // --- 単発タスク（完了済みも当日は残す。翌日のrolloverで完了済みを掃除） ---
  const adhoc=data.routine.adhoc||[];
  const adhocAll=adhoc.map((a,i)=>({a,i}));

  // 今日のカレンダー予定 → 個別のチェックできるタスクとして扱う
  // 完了状態は data.routine.eventDone[todayK] に予定IDの配列で保持（日付ごと・自動リセット）
  if(!data.routine.eventDone) data.routine.eventDone={};
  const doneToday = data.routine.eventDone[todayK] || (data.routine.eventDone[todayK]=[]);
  const evTasks = todayEvents.map(e=>({e, on:doneToday.includes(e.id)}));

  const openCount=adhocAll.filter(x=>!x.a.on).length
    + steps.filter(x=>!x.ch.on).length
    + evTasks.filter(x=>!x.on).length;
  const doneSteps=steps.filter(x=>x.ch.on).length;
  const totalShown=steps.length+adhocAll.length+evTasks.length;

  // 入力欄 + カウンターから選ぶ導線
  const counters=data.routine.counters||[];
  const counterChips = counters.length
    ? `<div class="td-counter-pick">
         <span class="tcp-lab">カウンターから追加：</span>
         ${counters.map(c=>`<button class="tcp-chip" onclick="addCounterTask('${c.id}')">${esc(c.name)} +</button>`).join("")}
       </div>`
    : "";
  const addHTML=`<div class="td-add">
    <input id="adhocInput" class="td-add-in" placeholder="今日やることを追加してEnter…" maxlength="80"
      onkeydown="if(event.key==='Enter')addAdhoc()">
    <button class="td-add-btn" onclick="addAdhoc()">追加</button>
  </div>${counterChips}`;

  // リスト本体
  let listItems="";
  // カレンダー予定（時刻順・各予定が個別タスク）
  evTasks.forEach(x=>{
    const e=x.e;
    const when = e.time||"終日";
    listItems+=`<div class="td-item ${x.on?'on':''}" data-cel="ev-${e.id}">
      <div class="box" onclick="toggleEventTask('${e.id}')"></div>
      <div class="td-text">
        <span class="t">${esc(e.title)}</span>
        <span class="src">📅 予定 · ${when}</span>
      </div>
      <span class="x" title="カレンダーで開く" onclick="setView('calendar');openEvent('${e.id}')">↗</span>
    </div>`;
  });
  // 単発タスク（未完了→上、完了→下に薄く）
  const sortedAdhoc=[...adhocAll].sort((a,b)=>(a.a.on?1:0)-(b.a.on?1:0));
  sortedAdhoc.forEach(x=>{
    const active=x.a.active?'active':'';
    const isCounter=!!x.a.counterId;
    const srcLabel = isCounter ? `カウンター${x.a.active?' · 着手中':''}` : `単発タスク${x.a.active?' · 着手中':''}`;
    listItems+=`<div class="td-item ${x.a.on?'on':''} ${active}" data-cel="ad-${x.a.id}">
      <div class="box" onclick="toggleAdhoc('${x.a.id}')"></div>
      <div class="td-text">
        <span class="t" ${x.a.on?'':'contenteditable'} spellcheck="false" oninput="editAdhoc('${x.a.id}',this.textContent)">${esc(x.a.t)}</span>
        <span class="src">${isCounter?'📊 ':''}${srcLabel}</span>
      </div>
      ${x.a.on?'':`<span class="play ${x.a.active?'on':''}" title="着手中にする" onclick="toggleAdhocActive('${x.a.id}')">▸</span>`}
      <span class="x" title="削除" onclick="delAdhoc('${x.a.id}')">✕</span>
    </div>`;
  });
  // プロジェクトの今日ステップ（未完了→上、完了→下に薄く）
  const sortedSteps=[...steps].sort((a,b)=>(a.ch.on?1:0)-(b.ch.on?1:0));
  sortedSteps.forEach(x=>{
    const active=x.ch.active?'active':'';
    listItems+=`<div class="td-item ${x.ch.on?'on':''} ${active}" data-cel="st-${x.cid}-${x.gid}-${x.idx}">
      <div class="box" onclick="toggleStepFromToday('${x.cid}','${x.gid}',${x.idx})"></div>
      <div class="td-text">
        <span class="t">${esc(x.ch.t)}</span>
        <span class="src">${esc(x.cat)} · ${esc(x.goal)}${x.ch.active?' · 着手中':''}</span>
      </div>
      ${x.ch.on?'':`<span class="play ${x.ch.active?'on':''}" title="着手中にする" onclick="toggleStepActive('${x.cid}','${x.gid}',${x.idx})">▸</span>`}
      <span class="star on" title="今日やるから外す" onclick="toggleToday('${x.cid}','${x.gid}',${x.idx})">●</span>
    </div>`;
  });

  let listHTML;
  if(totalShown===0){
    listHTML=`<div class="today-empty">今日やることはまだありません。<br>上の入力欄で単発タスクを足すか、各プロジェクトのステップで <span class="star-ex">○</span> を押すと、ここに集まります。</div>`;
  }else{
    listHTML=`<div class="today-list">${listItems}</div>`;
  }

  el.innerHTML=`
    <div class="today-head simple">
      <div class="title">
        <div class="td-big">TODAY'S FOCUS</div>
        <div class="sub">残り ${openCount} 件 · ステップ ${doneSteps}/${steps.length} 完了</div>
      </div>
    </div>
    ${listHTML}
    ${addHTML}`;
}

// ====== 単発タスク ======
function addAdhoc(){
  const inp=document.getElementById("adhocInput");
  if(!inp)return;
  const t=inp.value.trim();
  if(!t)return;
  data.routine.adhoc.push({id:uid(),t,on:false,active:false});
  inp.value="";
  render();
  // 追加後に入力欄へフォーカスを戻す（連続入力しやすく）
  const again=document.getElementById("adhocInput"); if(again)again.focus();
}
function toggleAdhoc(id){
  const a=data.routine.adhoc.find(x=>x.id===id); if(!a)return;
  const was=a.on; a.on=!was;
  if(!was){
    // 完了：着手中解除・達成+1・名前ログ記録・カウンター連動
    a.active=false;
    bumpAchieve(a.t);
    _celebrateItemId="ad-"+a.id;
    if(a.counterId){const c=data.routine.counters.find(x=>x.id===a.counterId);if(c)c.count=(c.count||0)+1;}
  }else{
    // 取り消し：達成-1・ログ削除・カウンター-1
    unbumpAchieve(a.t);
    if(a.counterId){const c=data.routine.counters.find(x=>x.id===a.counterId);if(c)c.count=Math.max(0,(c.count||0)-1);}
  }
  render();
}
// カレンダー予定タスクの完了トグル（その日ごとに保持）
function toggleEventTask(eid){
  const todayK=dateKey(new Date());
  if(!data.routine.eventDone) data.routine.eventDone={};
  const arr = data.routine.eventDone[todayK] || (data.routine.eventDone[todayK]=[]);
  const ev = data.events.find(x=>x.id===eid);
  const idx = arr.indexOf(eid);
  if(idx>=0){
    arr.splice(idx,1);                       // 取り消し
    if(ev) unbumpAchieve(ev.title);
  }else{
    arr.push(eid);                           // 完了
    if(ev) bumpAchieve(ev.title);
    _celebrateItemId="ev-"+eid;
  }
  render();
}
// カウンターから今日やることへ追加（紐付きタスク）
function addCounterTask(counterId){
  const c=data.routine.counters.find(x=>x.id===counterId); if(!c)return;
  data.routine.adhoc.push({id:uid(),t:c.name,on:false,active:false,counterId:counterId});
  render();
}
function editAdhoc(id,t){const a=data.routine.adhoc.find(x=>x.id===id);if(a&&!a.on){a.t=t;save();}}
function delAdhoc(id){data.routine.adhoc=data.routine.adhoc.filter(x=>x.id!==id);render();}
function toggleAdhocActive(id){

// 着手中は全体で1つだけ
function clearAllActive(){

}
function toggleStepActive(cid,gid,i){

// toggle a step's done-state from the Today panel (mirrors the project step)
function toggleStepFromToday(cid,gid,i){

function toggleToday(cid,gid,i){

function renderBoard(){
  const board=document.getElementById("board");
